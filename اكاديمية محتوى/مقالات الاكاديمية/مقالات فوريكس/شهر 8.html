        const totalArticles = 50;
        const articlesContainer = document.getElementById('articlesContainer');

        // تواريخ شهر 8 لعام 2026 (توزيع الـ 50 مقالاً على أيام الشهر)
        function getAugustDate(index) {
            let day = ((index - 1) % 31) + 1;
            let dayStr = day < 10 ? '0' + day : day;
            return `2026-08-${dayStr}`;
        }

        for (let i = 1; i <= totalArticles; i++) {
            let articleDate = getAugustDate(i);
            const articleHTML = `
                <div class="article-card">
                    <span class="date-badge">📅 تاريخ النشر: ${articleDate} (مقال ${i})</span>
                    
                    <div class="upload-section">
                        <label for="upload-${i}" class="upload-btn">اختر صورة المقال 📷</label>
                        <input type="file" id="upload-${i}" accept="image/*" style="display: none;" onchange="previewImage(this, 'preview-${i}')">
                        <img id="preview-${i}" class="image-preview" alt="معاينة صورة المقال">
                    </div>

                    <div id="text-${i}" class="article-content">
                        <h2 id="title-${i}" class="article-title">مقال الفوركس رقم (${i})</h2>
                        <h3 id="subtitle-${i}" class="article-subtitle">عنوان فرعي سيظهر هنا...</h3>
                        <span class="article-author">بقلم: رضا الحجي</span>
                        <p id="content-${i}" class="article-body">اضغط على زر "توليد مقال تداولي" أدناه لإنشاء المحتوى الحصري الخاص بهذا المقال...</p>
                    </div>

                    <div class="actions-group">
                        <button class="action-btn generate-btn" onclick="generateForexArticle(${i})">توليد مقال تداولي 🪄</button>
                        <button class="action-btn copy-btn" onclick="copyArticle('text-${i}')">نسخ المقال 📋</button>
                    </div>
                    
                </div>
            `;
            
            articlesContainer.insertAdjacentHTML('beforeend', articleHTML);
        }

        function previewImage(inputElement, previewId) {
            const file = inputElement.files[0];
            const previewImage = document.getElementById(previewId);
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // دالة عرض المقال الحصري المستقل تماماً لكل بطاقة
        function generateForexArticle(index) {
            const item = forexUniqueDatabase[index - 1]; // جلب المقال الفريد المخصص لهذا الرقم

            const titleText = item.t;
            const subtitleText = item.s;
            const bodyText = item.body;

            // حقن البيانات في الواجهة بدقة
            document.getElementById(`title-${index}`).innerText = titleText;
            document.getElementById(`subtitle-${index}`).innerText = subtitleText;
            
            const contentElement = document.getElementById(`content-${index}`);
            contentElement.innerHTML = bodyText;
            contentElement.style.color = "#475569";
            contentElement.style.fontStyle = "normal";
        }

        function copyArticle(textId) {
            const articleContainer = document.getElementById(textId);
            const textToCopy = articleContainer.innerText;
            
            if (textToCopy.includes("اضغط على زر")) {
                alert('⚠️ يرجى توليد المقال التداولي أولاً قبل النسخ!');
                return;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('✅ تم نسخ مقال الفوركس (بالعنوان والترويسة) بنجاح!');
            }).catch(err => {
                alert('❌ حدث خطأ أثناء النسخ.');
                console.error(err);
            });
        }
    </script>
