<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <title>منشورات LinkedIn - Enter Point Trading Academy | سبتمبر 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff;
            padding: 0;
            padding-top: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Navbar Header */
        .navbar {
            background: #0f0f1e;
            border-bottom: 2px solid #d4af37;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: nowrap;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .navbar-logo-mark {
            width: 42px;
            height: 42px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #d4af37;
            font-size: 16px;
            letter-spacing: -1px;
            background: rgba(212, 175, 55, 0.08);
            flex-shrink: 0;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .navbar-brand .brand-main {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
        }

        .navbar-brand .brand-main span {
            color: #d4af37;
        }

        .navbar-brand .brand-sub {
            font-size: 10px;
            color: #9e9e9e;
            white-space: nowrap;
        }

        /* Center Nav */
        .navbar-center {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #d4af37;
        }

        .nav-link .chevron {
            font-size: 9px;
            opacity: 0.5;
        }

        /* Left Buttons */
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .nav-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
            white-space: nowrap;
        }

        .nav-pill:hover {
            border-color: #d4af37;
        }

        .nav-pill .pill-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .pill-icon.lang {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }

        .pill-icon.support {
            background: rgba(0, 188, 212, 0.15);
            color: #00bcd4;
        }

        /* News Ticker */
        .news-ticker {
            background: linear-gradient(135deg, #0f1b3a 0%, #1a2d5a 100%);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }

        .news-ticker::before {
            content: 'BREAKING';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #000;
            font-size: 11px;
            font-weight: 900;
            padding: 0 10px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }

        .ticker-content {
            display: flex;
            gap: 40px;
            animation: scroll 30s infinite linear;
            margin-right: 100px;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .ticker-item {
            white-space: nowrap;
            color: #d4af37;
            font-weight: 600;
            font-size: 13px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 20px 25px;
            flex: 1;
            min-width: 150px;
        }

        .stat-label {
            font-size: 12px;
            color: #9e9e9e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: #d4af37;
        }

        /* Day Sections */
        .day-section {
            margin-bottom: 40px;
        }

        .day-section.all-published {
            opacity: 0.6;
        }

        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
            border-radius: 10px 10px 0 0;
            border-bottom: 1px solid #d4af37;
            margin-bottom: 15px;
        }

        .day-header.published {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(76, 175, 80, 0.05) 100%);
            border-bottom-color: #4cb50;
        }

        .day-title {
            font-size: 16px;
            font-weight: 700;
            color: #d4af37;
        }

        .day-header.published .day-title {
            color: #4cb50;
        }

        .day-count {
            font-size: 12px;
            color: #9e9e9e;
        }

        .day-posts {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Post Card */
        .post-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .post-card:hover {
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }

        .post-card.published {
            opacity: 0.5;
            background: linear-gradient(135deg, #1a2e1a 0%, #1e3e1e 100%);
            border-color: #4cb50;
        }

        .post-published-container {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-published-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .post-published-label {
            font-size: 11px;
            color: #9e9e9e;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            margin-top: 5px;
        }

        .post-time {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 5px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
        }

        .post-time.evening {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
        }

        .post-number {
            font-size: 11px;
            color: #9e9e9e;
            font-weight: 600;
        }

        .post-text {
            font-size: 14px;
            line-height: 1.8;
            color: #e0e0e0;
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .hashtags {
            font-size: 11px;
            color: #00bcd4;
            line-height: 1.5;
        }

        .copy-btn {
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Tajawal', sans-serif;
        }

        .copy-btn:hover {
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .copy-feedback {
            font-size: 11px;
            color: #4cb50;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 15px;
            }

            .navbar-center {
                display: none;
            }

            .stat-box {
                min-width: 100%;
            }

            .post-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <div class="nav-pill">
                <span class="pill-icon lang">🌐</span>
                <span>العربية</span>
            </div>
            <div class="nav-pill">
                <span class="pill-icon support">💬</span>
                <span>الدعم</span>
            </div>
        </div>
        <div class="navbar-center">
            <a class="nav-link active">منشورات سبتمبر</a>
            <a class="nav-link">التحليلات</a>
            <a class="nav-link">الأداء</a>
        </div>
        <div class="navbar-right">
            <div class="navbar-logo-mark">EP</div>
            <div class="navbar-brand">
                <span class="brand-main">Enter <span>Point</span></span>
                <span class="brand-sub">Trading Academy</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="news-ticker">
            <div class="ticker-content">
                <span class="ticker-item">📊 منشورات شهر سبتمبر جاهزة للنشر</span>
                <span class="ticker-item">🎓 30 يوم من التعليم المكثف</span>
                <span class="ticker-item">💎 أساس الاحتراف والمهارة</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-label">منشورات منشورة</span>
                <span class="stat-value" id="totalPublished">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">باقية للنشر</span>
                <span class="stat-value" id="totalRemaining">60</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">نسبة الإنجاز</span>
                <span class="stat-value" id="publishPercentage">0%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">أيام مكتملة</span>
                <span class="stat-value" id="daysCompleted">0</span>
            </div>
        </div>

        <div id="postsContainer"></div>
    </div>

    <script>
        const posts = [
            // Day 1
            { day: 1, type: 'morning', text: 'سبتمبر = شهر التعليم.\n\nاليوم الأول:\nانت بتبدأ رحلة تحويل.\n\nليس رحلة عادية.\nرحلة = بتغير مستقبلك.\n\nالتعليم = السلاح.\n\n#Learning #NewBeginning #EnterPoint' },
            { day: 1, type: 'evening', text: 'مساء البداية:\n\nأول يوم من التعليم.\nأول يوم من النمو.\nأول يوم من احتمال النجاح.\n\nتذكر هذا اليوم.\nبعد سنة:\nستقول: هنا بدأت كل حاجة.\n\n#FirstStep #Journey #EnterPoint' },

            // Day 2
            { day: 2, type: 'morning', text: 'درس 1 من أساسيات التداول:\n\nالسوق:\n= نظام بنفس قوانين الطبيعة.\n\nمن يفهم القانون:\nبيفوز.\nمن ما يفهم:\nبيخسر.\n\nركز على فهم القوانين.\n\n#MarketLaws #Understanding #EnterPoint' },
            { day: 2, type: 'evening', text: 'مساء الفهم:\n\nالسوق ليس عدو.\nهو = معلم.\n\nاللي بيخسر:\nليس لأن السوق ضد.\nبل لأنه ما فهم الدرس.\n\nأنت الآن بتفهم.\n\n#MarketAsTeacher #LearningCurve #EnterPoint' },

            // Day 3
            { day: 3, type: 'morning', text: 'درس 2:\n\nالتحليل:\n= مهارة أساسية.\n\nمحلل ضعيف = متاجر خاسر.\nمحلل قوي = متاجر رابح.\n\nهذا الشهر:\nبتقوي تحليلك.\n\n#Analysis #Skill #EnterPoint' },
            { day: 3, type: 'evening', text: 'مساء التحليل:\n\nالتحليل = ليس خمين.\nهو = علم.\n\nعلم يتعلم:\n✓ القراءة\n✓ الفهم\n✓ التطبيق\n\nأنت الآن بتتعلم.\n\n#AnalysisIsFact #Science #EnterPoint' },

            // Day 4
            { day: 4, type: 'morning', text: 'درس 3:\n\nالأفكار الخاطئة = السم.\n\nأكثر متاجر بيخسرون:\nبسبب أفكار خاطئة:\n\"الربح سريع\"\n\"الحظ موجود\"\n\"إني أذكى من السوق\"\n\nأنسى هذه الأفكار.\n\n#MindShift #MythBusting #EnterPoint' },
            { day: 4, type: 'evening', text: 'مساء التصحيح:\n\nإذا كنت عندك أفكار خاطئة:\nالآن = وقت تصحيحها.\n\nتصحيح = بؤ = شفاء.\n\nالفكرة الخاطئة = سم.\nالتصحيح = ترياق.\n\n#Correction #Healing #EnterPoint' },

            // Day 5
            { day: 5, type: 'morning', text: 'درس 4:\n\nالمشاعر في التداول:\n= عدو.\n\nإذا قررت:\nبمشاعرك = خسرت.\nإذا قررت:\nبعقلك = ربحت.\n\nهذا الشهر = تتعلم التحكم.\n\n#EmotionalControl #Logic #EnterPoint' },
            { day: 5, type: 'evening', text: 'مساء السيطرة:\n\nالمتاجر الناجح:\nيصرف عواطفه في الباب.\nبعدين = يدخل السوق بعقل.\n\nأنت بتتعلم تصرف عواطفك.\n\n#Discipline #Rationality #EnterPoint' },

            // Day 6
            { day: 6, type: 'morning', text: 'درس 5:\n\nالصبر = أطول سلاح.\n\nمتاجر بدون صبر:\n= جندي بدون سلاح.\n\nهذا الشهر:\nبتبني صبرك.\nبتتعلم الانتظار الذكي.\n\n#Patience #WaitingGame #EnterPoint' },
            { day: 6, type: 'evening', text: 'مساء الانتظار:\n\nالفرصة:\nتأتي لمن ينتظر.\n\nإذا انتظرت = تجي الفرصة.\nإذا ما صبرت = بتيجي خسارة.\n\nاختر الصبر.\n\n#PatienceRewards #Timing #EnterPoint' },

            // Day 7
            { day: 7, type: 'morning', text: 'أول أسبوع من التعليم انتهى.\n\nسؤال:\nهل تعلمت حاجة جديدة؟\n\nإذا نعم:\nاستمر.\n\nإذا لا:\nركز أكثر.\n\nالتعليم = ليس بالسرعة.\nبل بالفهم.\n\n#WeeklyReview #Comprehension #EnterPoint' },
            { day: 7, type: 'evening', text: 'مساء التقييم:\n\nأول أسبوع:\nبيخبرك إذا أنت جاد أم لا.\n\nإذا درست بجد:\nأنت على الطريق.\n\nإذا قاعد تتسلى:\nأنت = في الطريق الخاطئ.\n\n#Seriousness #Commitment #EnterPoint' },

            // Day 8
            { day: 8, type: 'morning', text: 'درس 6:\n\nالمخاطرة:\n= ليست الشيء السيء.\n\nالشيء السيء = المخاطرة بدون حساب.\n\nالمخاطرة المحسوبة:\n= احتراف.\n\nهذا الشهر بتتعلم.\n\n#RiskManagement #CalculatedRisk #EnterPoint' },
            { day: 8, type: 'evening', text: 'مساء المخاطرة:\n\nكل صفقة:\nفيها مخاطرة.\n\nبس المحترف:\nبيحسبها قبل الدخول.\n\nأنت الآن بتتعلم الحسبة.\n\n#RiskCalculation #Expertise #EnterPoint' },

            // Day 9
            { day: 9, type: 'morning', text: 'درس 7:\n\nالخسارة:\n= ليست نهاية.\n\nالخسارة = درس.\nالدرس = ثروة.\n\nإذا خسرت بدون درس:\nتلك = خسارة.\n\nإذا خسرت مع درس:\nتلك = استثمار.\n\n#LossAsLesson #Education #EnterPoint' },
            { day: 9, type: 'evening', text: 'مساء الحكمة:\n\nأغلى الدروس:\nجاية من أكبر خسائر.\n\nمن يتعلم من خسارته:\nبيصبح أقوى.\n\nمن بينسى الدرس:\nبيكررها.\n\n#GainFromLoss #Growth #EnterPoint' },

            // Day 10
            { day: 10, type: 'morning', text: 'يوم 10 من التعليم:\n\nثلث الشهر انتهى.\nثلثين = في العمق.\n\nالأسبوع القادم:\nبتكون أصعب.\nلكن = تعلم أعمق.\n\nاستعد.\n\n#Midpoint #Deeper #EnterPoint' },
            { day: 10, type: 'evening', text: 'مساء المنتصف:\n\nأنت الآن:\nبدأت تفهم.\n\nالنص الثاني:\nبتفهم أعمق.\n\nالفهم = بيتراكم.\nكل يوم = فهم أكثر.\n\n#Understanding #Accumulation #EnterPoint' },

            // Day 11
            { day: 11, type: 'morning', text: 'درس 8:\n\nالنظام:\n= أساس كل شيء.\n\nمتاجر بدون نظام:\n= سفينة بدون بوصلة.\n\nهذا الشهر:\nبتبني نظام التداول.\n\n#System #Structure #EnterPoint' },
            { day: 11, type: 'evening', text: 'مساء النظام:\n\nالنظام يعني:\n✓ قواعد ثابتة\n✓ خطة واضحة\n✓ انضباط صارم\n\nبدون هذا = كل يوم = بتتخذ قرارات عشوائية.\n\n#SystemicApproach #Discipline #EnterPoint' },

            // Day 12
            { day: 12, type: 'morning', text: 'درس 9:\n\nالاختبار:\n= ليس على الحقيقي.\n\nقبل ما تدخل السوق:\nتجرب على حساب وهمي.\n\nالحساب الوهمي:\n= معسكر الحقيقي.\n\n#Demo #Practice #EnterPoint' },
            { day: 12, type: 'evening', text: 'مساء التدريب:\n\nالحساب الوهمي:\nبتعطيك كل شيء الحقيقي:\nإلا المال.\n\nهذا = أمان.\nتتعلم بدون تكلفة حقيقية.\n\n#SafeLearning #PracticeAccount #EnterPoint' },

            // Day 13
            { day: 13, type: 'morning', text: 'درس 10:\n\nالتركيز:\n= أهم من الذكاء.\n\nمتاجر متوسط الذكاء + تركيز عالي:\nأفضل من\nمتاجر ذكي جداً + تركيز منخفض.\n\n#Focus #Concentration #EnterPoint' },
            { day: 13, type: 'evening', text: 'مساء التركيز:\n\nركزك هو السلاح.\n\nإذا ركزت:\nبتشوف الفرص.\nإذا تشتتت:\nبتخسر الفرص.\n\nتعلم التركيز.\n\n#FocusedMind #Opportunity #EnterPoint' },

            // Day 14
            { day: 14, type: 'morning', text: 'نص الشهر = نقطة حرجة.\n\nإذا استمررت الآن:\nأنت = جاد.\n\nإذا توقفت:\nأنت = كالـ 95% من المبتدئين.\n\nاختر.\n\n#Midpoint #CriticalChoice #EnterPoint' },
            { day: 14, type: 'evening', text: 'مساء الاختيار:\n\nنص الشهر:\nيظهر من سيستمر.\nومن سيستسلم.\n\nأنت = المستمر.\nأنت = الناجح.\n\n#Persistence #Winner #EnterPoint' },

            // Day 15
            { day: 15, type: 'morning', text: 'درس 11:\n\nالسيولة:\n= قلب السوق.\n\nإذا لا توجد سيولة:\nالسوق = ميت.\n\nتعلم متى تكون السيولة عالية:\nومتى تكون منخفضة.\n\n#Liquidity #MarketDynamics #EnterPoint' },
            { day: 15, type: 'evening', text: 'مساء السيولة:\n\nالسيولة العالية:\n= فرص أفضل.\nالسيولة المنخفضة:\n= انتظر.\n\nتعلم قراءة السيولة.\n\n#LiquidityMatters #Timing #EnterPoint' },

        // Group posts by day
        function generateDays() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            const days = {};
            posts.forEach(post => {
                if (!days[post.day]) {
                    days[post.day] = { morning: null, evening: null };
                }
                days[post.day][post.type] = post;
            });

            Object.keys(days).sort((a, b) => a - b).forEach(dayNum => {
                const dayData = days[dayNum];
                const daySection = document.createElement('div');
                daySection.className = 'day-section';
                daySection.id = `day-${dayNum}`;

                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.innerHTML = `
                    <span class="day-title">اليوم ${dayNum}</span>
                    <span class="day-count">منشورات: 2</span>
                `;

                const dayPosts = document.createElement('div');
                dayPosts.className = 'day-posts';

                // Morning post
                if (dayData.morning) {
                    dayPosts.appendChild(createPostCard(dayData.morning, dayNum * 2 - 1));
                }

                // Evening post
                if (dayData.evening) {
                    dayPosts.appendChild(createPostCard(dayData.evening, dayNum * 2));
                }

                daySection.appendChild(dayHeader);
                daySection.appendChild(dayPosts);
                container.appendChild(daySection);
            });

            updateStats();
        }

        function createPostCard(post, index) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.id = `post-${index}`;

            const timeClass = post.type === 'morning' ? 'morning' : 'evening';
            const timeText = post.type === 'morning' ? '☀️ صباحاً' : '🌙 مساءً';

            card.innerHTML = `
                <div class="post-published-container">
                    <input type="checkbox" class="post-published-checkbox" onchange="togglePublished(${index})">
                    <span class="post-published-label"></span>
                </div>
                <div class="post-header">
                    <span class="post-time ${timeClass}">${timeText}</span>
                    <span class="post-number">#${index}</span>
                </div>
                <div class="post-text">${escapeHtml(post.text)}</div>
                <div class="post-footer">
                    <div class="hashtags">#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji #StockMarket #InvestmentStrategy</div>
                    <button class="copy-btn" onclick="copyPost(${index})">📋 نسخ النص</button>
                    <span class="copy-feedback" id="feedback-${index}">✓ تم النسخ</span>
                </div>
            `;

            return card;
        }

        function togglePublished(index) {
            const card = document.getElementById(`post-${index}`);
            const checkbox = card.querySelector('.post-published-checkbox');
            
            card.classList.toggle('published', checkbox.checked);

            // Check if day is complete
            const postNumber = index;
            const dayNum = Math.ceil(postNumber / 2);
            const daySection = document.getElementById(`day-${dayNum}`);
            
            const dayCheckboxes = daySection.querySelectorAll('.post-published-checkbox');
            const allChecked = Array.from(dayCheckboxes).every(cb => cb.checked);
            
            const dayHeader = daySection.querySelector('.day-header');
            dayHeader.classList.toggle('published', allChecked);
            daySection.classList.toggle('all-published', allChecked);

            updateStats();
        }

        function updateStats() {
            const allCheckboxes = document.querySelectorAll('.post-published-checkbox');
            const checkedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
            const totalCount = allCheckboxes.length;
            const remainingCount = totalCount - checkedCount;
            const percentage = Math.round((checkedCount / totalCount) * 100);

            const completedDays = Array.from(document.querySelectorAll('.day-section.all-published')).length;

            document.getElementById('totalPublished').textContent = checkedCount;
            document.getElementById('totalRemaining').textContent = remainingCount;
            document.getElementById('publishPercentage').textContent = percentage + '%';
            document.getElementById('daysCompleted').textContent = completedDays;
        }

        function copyPost(index) {
            const post = posts[index - 1];
            const fullText = `${post.text}\n\n#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji #StockMarket #InvestmentStrategy\n\nhttps://www.enterpoint.online/`;
            
            navigator.clipboard.writeText(fullText).then(() => {
                const feedback = document.getElementById(`feedback-${index}`);
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('حدث خطأ في النسخ');
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        generateDays();
    </script>
