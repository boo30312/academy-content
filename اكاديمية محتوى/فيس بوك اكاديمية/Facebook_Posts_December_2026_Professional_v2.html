        function generateDays() {
            const container = document.getElementById('postsContainer');
            const savedState = JSON.parse(localStorage.getItem('fb_posts_12_pro')) || {};
            const days = {};
            posts.forEach(p => { if(!days[p.day]) days[p.day] = {m:null, e:null}; if(p.type==='morning') days[p.day].m=p; else days[p.day].e=p; });
            
            Object.keys(days).sort((a,b)=>a-b).forEach(d => {
                const sec = document.createElement('div'); sec.className = 'day-section';
                sec.innerHTML = `<div class="day-header"><span>اليوم ${d}</span></div><div class="day-posts"></div>`;
                const postsDiv = sec.querySelector('.day-posts');
                [days[d].m, days[d].e].forEach((p, idx) => {
                    const i = (d-1)*2 + idx + 1;
                    const card = document.createElement('div'); card.className = 'post-card' + (savedState[`p-${i}`]?' published':'');
                    card.innerHTML = `<div class="post-published-container"><input type="checkbox" style="width:18px; height:18px; cursor:pointer;" onchange="toggle(this, ${i})" ${savedState[`p-${i}`]?'checked':''}></div>
                    <div><span class="post-time ${p.type}">${p.type==='morning'?'☀️ صباحاً':'🌙 مساءً'}</span></div>
                    <div class="post-text">${p.text.replace(/\n/g, '<br>')}</div>
                    <button class="copy-btn" onclick="copy(${i})">📋 نسخ النص</button><span class="copy-feedback" id="f-${i}">✓ تم النسخ بنجاح</span>`;
                    postsDiv.appendChild(card);
                });
                container.appendChild(sec);
            });
        }
        function toggle(cb, i) {
            cb.parentElement.parentElement.classList.toggle('published', cb.checked);
            const state = JSON.parse(localStorage.getItem('fb_posts_12_pro')) || {};
            state[`p-${i}`] = cb.checked;
            localStorage.setItem('fb_posts_12_pro', JSON.stringify(state));
        }
        function copy(i) {
            navigator.clipboard.writeText(posts[i-1].text).then(() => {
                const f = document.getElementById(`f-${i}`); f.classList.add('show');
                setTimeout(()=>f.classList.remove('show'), 2000);
            });
        }
        generateDays();
    </script>
