    <script>
        const posts = [{"day": 1, "type": "morning", "text": "☀️ صباح الانضباط والفرص الجديدة 🚀\n\nسر النجاح اليوم يكمن في تطبيق أهمية التحليل الفني. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 1, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nمراجعة أداءنا في أهمية التحليل الفني اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nالراحة الآن ضرورية جداً لنعود بتركيز أعلى غداً.\n\n#تعلم_التداول #فوركس"}, {"day": 2, "type": "morning", "text": "☀️ صباح الانضباط والفرص الجديدة 🚀\n\nهل فكرت يوماً في كيفية إتقان إدارة الصفقات المفتوحة؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 2, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nخلاصة اليوم: التعامل مع كيفية إتقان إدارة الصفقات المفتوحة يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 3, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nموضوعنا اليوم هو أهمية اختيار ساعات السوق المناسبة. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 3, "type": "evening", "text": "🌙 انتهت جلسة اليوم! حان وقت الراحة 🏁\n\nمراجعة أداءنا في أهمية اختيار ساعات السوق المناسبة اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 4, "type": "morning", "text": "☀️ يوم جديد، فرص جديدة للتعلم والربح 💡\n\nفي جلسة اليوم، نركز على كيفية إتقان استراتيجية السكالبينج. راقب كيف يتفاعل السوق مع هذا العنصر وحاول استغلاله لصالحك بدقة.\n\nدعونا نلتزم بخطتنا ولا ندع العواطف تسيطر.\n\n#EnterPoint_Academy #تداول"}, {"day": 4, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nاليوم ركزنا على كيفية إتقان استراتيجية السكالبينج. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nما هو تقييمكم لحركة السوق والسيولة اليوم؟\n\n#تعلم_التداول #فوركس"}, {"day": 5, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nاليوم سنولي اهتماماً خاصاً لـ أهمية قراءة حجم التداول (Volume). التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 5, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nمراجعة أداءنا في أهمية قراءة حجم التداول (Volume) اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 6, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nسر النجاح اليوم يكمن في تطبيق أبرز الأخطاء في نماذج البرايس أكشن. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 6, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أبرز الأخطاء في نماذج البرايس أكشن كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nما هو تقييمكم لحركة السوق والسيولة اليوم؟\n\n#تعلم_التداول #فوركس"}, {"day": 7, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nدرسنا اليوم يركز على أهمية تحديد مناطق العرض والطلب. لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 7, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ أهمية تحديد مناطق العرض والطلب. هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nاكتبوا لنا في التعليقات أهم درس تعلمتوه اليوم.\n\n#تعلم_التداول #فوركس"}, {"day": 8, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nنصيحة اليوم تدور حول أهمية التداول المتأرجح (Swing). تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nتذكروا دائماً: إدارة المخاطر تأتي أولاً.\n\n#EnterPoint_Academy #تداول"}, {"day": 8, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nاليوم ركزنا على أهمية التداول المتأرجح (Swing). المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nما هو تقييمكم لحركة السوق والسيولة اليوم؟\n\n#تعلم_التداول #فوركس"}, {"day": 9, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nفي جلسة اليوم، نركز على كيفية إتقان تجنب التداول عكس الترند. راقب كيف يتفاعل السوق مع هذا العنصر وحاول استغلاله لصالحك بدقة.\n\nكيف ترون اتجاه السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 9, "type": "evening", "text": "🌙 انتهت جلسة اليوم! حان وقت الراحة 🏁\n\nخلاصة اليوم: التعامل مع كيفية إتقان تجنب التداول عكس الترند يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 10, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nسر النجاح اليوم يكمن في تطبيق أبرز الأخطاء في تحليل الأطر الزمنية المتعددة. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nشاركنا رأيك أو تحليلك في التعليقات.\n\n#EnterPoint_Academy #تداول"}, {"day": 10, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أبرز الأخطاء في تحليل الأطر الزمنية المتعددة كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 11, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nسر النجاح اليوم يكمن في تطبيق أبرز الأخطاء في فهم سيكولوجية الحشود. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nكيف ترون اتجاه السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 11, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nجلسة اليوم كانت فرصة لاختبار مهاراتنا في أبرز الأخطاء في فهم سيكولوجية الحشود. تقييم أدائك بصدق هو الخطوة الأولى نحو الاحتراف.\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 12, "type": "morning", "text": "☀️ مرحباً بكم في جلسة تداول جديدة 📊\n\nهل فكرت يوماً في كيفية إتقان نسبة العائد للمخاطرة (R:R)؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 12, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nنأمل أن يكون درس اليوم حول كيفية إتقان نسبة العائد للمخاطرة (R:R) قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nالراحة الآن ضرورية جداً لنعود بتركيز أعلى غداً.\n\n#تعلم_التداول #فوركس"}, {"day": 13, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nدرسنا اليوم يركز على أبرز الأخطاء في تجنب التداول وقت الأخبار القوية. لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 13, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أبرز الأخطاء في تجنب التداول وقت الأخبار القوية كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 14, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nسر النجاح اليوم يكمن في تطبيق أهمية تجنب التداول وقت الأخبار القوية. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nتذكروا دائماً: إدارة المخاطر تأتي أولاً.\n\n#EnterPoint_Academy #تداول"}, {"day": 14, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nخلاصة اليوم: التعامل مع أهمية تجنب التداول وقت الأخبار القوية يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nالراحة الآن ضرورية جداً لنعود بتركيز أعلى غداً.\n\n#تعلم_التداول #فوركس"}, {"day": 15, "type": "morning", "text": "☀️ يوم جديد، فرص جديدة للتعلم والربح 💡\n\nاليوم سنولي اهتماماً خاصاً لـ أبرز الأخطاء في استخدام أوامر التداول المعلقة. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 15, "type": "evening", "text": "🌙 حصاد اليوم في الأسواق المالية 🌾\n\nبعد  دائماً: إدارة المخاطر تأتي أولاً.\n\n#EnterPoint_Academy #تداول"}, {"day": 19, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nجلسة اليوم كانت فرصة لاختبار مهاراتنا في أهمية حجم العقد (Lot size). تقييم أدائك بصدق هو الخطوة الأولى نحو الاحتراف.\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 20, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nدرسنا اليوم يركز على كيفية إتقان الخوف من تفويت الفرصة (FOMO). لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 20, "type": "evening", "text": "🌙 جلسة تداول انتهت، ودروس جديدة أضفناها لرصيدنا 💡\n\nنأمل أن يكون درس اليوم حول كيفية إتقان الخوف من تفويت الفرصة (FOMO) قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 21, "type": "morning", "text": "☀️ يوم جديد، فرص جديدة للتعلم والربح 💡\n\nاليوم سنولي اهتماماً خاصاً لـ أبرز الأخطاء في الرافعة المالية. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 21, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nاليوم ركزنا على أبرز الأخطاء في الرافعة المالية. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 22, "type": "morning", "text": "☀️ صباح الانضباط والفرص الجديدة 🚀\n\nنصيحة اليوم تدور حول كيفية إتقان حجم العقد (Lot size). تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nشاركنا رأيك أو تحليلك في التعليقات.\n\n#EnterPoint_Academy #تداول"}, {"day": 22, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ كيفية إتقان حجم العقد (Lot size). هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 23, "type": "morning", "text": "☀️ صباح الانضباط والفرص الجديدة 🚀\n\nفي جلسة اليوم، نركز على كيفية إتقان تجنب التداول العشوائي. راقب كيف يتفاعل السوق مع هذا العنصر وحاول استغلاله لصالحك بدقة.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 23, "type": "evening", "text": "🌙 كيف كان يومكم في الأسواق؟ 📊\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق كيفية إتقان تجنب التداول العشوائي كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nاكتبوا لنا في التعليقات أهم درس تعلمتوه اليوم.\n\n#تعلم_التداول #فوركس"}, {"day": 24, "type": "morning", "text": "☀️ صباح الخير يا أبطال Enter Point!\n\nالتميز في التداول يتطلب فهم أبرز الأخطاء في استخدام مستويات فيبوناتشي. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 24, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nمراجعة أداءنا في أبرز الأخطاء في استخدام مستويات فيبوناتشي اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nالراحة الآن ضرورية جداً لنعود بتركيز أعلى غداً.\n\n#تعلم_التداول #فوركس"}, {"day": 25, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nهل فكرت يوماً في أهمية الالتزام بالخطة المكتوبة؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nكيف ترون اتجاه السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 25, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nنأمل أن يكون درس اليوم حول أهمية الالتزام بالخطة المكتوبة قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 26, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nهل فكرت يوماً في أبرز الأخطاء في اختيار ساعات السوق المناسبة؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nتذكروا دائماً: إدارة المخاطر تأتي أولاً.\n\n#EnterPoint_Academy #تداول"}, {"day": 26, "type": "evening", "text": "🌙 انتهت جلسة اليوم! حان وقت الراحة 🏁\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في اختيار ساعات السوق المناسبة قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 27, "type": "morning", "text": "☀️ مرحباً بكم في جلسة تداول جديدة 📊\n\nسر النجاح اليوم يكمن في تطبيق أبرز الأخطاء في تجنب التداول العشوائي. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nانضباطك اليوم هو أرباحك في الغد.\n\n#EnterPoint_Academy #تداول"}, {"day": 27, "type": "evening", "text": "🌙 كيف كان يومكم في الأسواق؟ 📊\n\nبعد يوم حافل، من الجيد أن نتوقف لنراجع كيف تعاملنا مع أبرز الأخطاء في تجنب التداول العشوائي. الأخطاء هي دروس، تأكد من استيعابها.\n\nكيف تقيمون أداءكم ونفسيتكم اليوم من 10؟\n\n#تعلم_التداول #فوركس"}, {"day": 28, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nسر النجاح اليوم يكمن في تطبيق أبرز الأخطاء في تطوير الصبر. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nشاركنا رأيك أو تحليلك في التعليقات.\n\n#EnterPoint_Academy #تداول"}, {"day": 28, "type": "evening", "text": "🌙 مساء الخير متداولينا الأعزاء.\n\nخلاصة اليوم: التعامل مع أبرز الأخطاء في تطوير الصبر يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 29, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nهل فكرت يوماً في كيفية إتقان الرافعة المالية؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 29, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nمراجعة أداءنا في كيفية إتقان الرافعة المالية اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 30, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nاليوم سنولي اهتماماً خاصاً لـ كيفية إتقان إدارة المخاطر. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nشاركنا رأيك أو تحليلك في التعليقات.\n\n#EnterPoint_Academy #تداول"}, {"day": 30, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق كيفية إتقان إدارة المخاطر كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nتصبحون على خيارات أذكى وأرباح أكثر.\n\n#تعلم_التداول #فوركس"}];
        function generateDays() {
            const container = document.getElementById('postsContainer');
            const savedState = JSON.parse(localStorage.getItem('fb_posts_12_v2')) || {};
            const days = {};
            posts.forEach(p => { if(!days[p.day]) days[p.day] = {m:null, e:null}; if(p.type==='morning') days[p.day].m=p; else days[p.day].e=p; });
            
            Object.keys(days).sort((a,b)=>a-b).forEach(d => {
                const sec = document.createElement('div'); sec.className = 'day-section';
                sec.innerHTML = `<div class="day-header"><span>اليوم ${d}</span></div><div class="day-posts"></div>`;
                const postsDiv = sec.querySelector('.day-posts');
                [days[d].m, days[d].e].forEach((p, idx) => {
                    const i = (d-1)*2 + idx + 1;
                    const card = document.createElement('div'); card.className = 'post-card' + (savedState[`p-${i}`]?' published':'');
                    card.innerHTML = `<div class="post-published-container"><input type="checkbox" style="width:18px; height:18px; cursor:pointer;" onchange="toggle(this, ${i})" ${savedState[`p-${i}`]?'checked':''}></div>
                    <div><span class="post-time ${p.type}">${p.type==='morning'?'☀️ صباحاً':'🌙 مساءً'}</span></div>
                    <div class="post-text">${p.text.replace(/\n/g, '<br>')}</div>
                    <button class="copy-btn" onclick="copy(${i})">📋 نسخ النص</button><span class="copy-feedback" id="f-${i}">✓ تم النسخ بنجاح</span>`;
                    postsDiv.appendChild(card);
                });
                container.appendChild(sec);
            });
        }
        function toggle(cb, i) {
            cb.parentElement.parentElement.classList.toggle('published', cb.checked);
            const state = JSON.parse(localStorage.getItem('fb_posts_12_v2')) || {};
            state[`p-${i}`] = cb.checked;
            localStorage.setItem('fb_posts_12_v2', JSON.stringify(state));
        }
        function copy(i) {
            navigator.clipboard.writeText(posts[i-1].text).then(() => {
                const f = document.getElementById(`f-${i}`); f.classList.add('show');
                setTimeout(()=>f.classList.remove('show'), 2000);
            });
        }
        generateDays();
    </script>
