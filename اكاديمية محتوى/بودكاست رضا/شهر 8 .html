            `🔥 [هوك]: الجمود الإداري هو المقبرة الصامتة لأي أكاديمية تدريبية!
            
            التفاصيل: إذا ضليت تعمل نفس الأشياء بنفس الأساليب وبنفس القاعات، فانت بتستنا المؤسسة تموت ببطء. الابتكار المؤسسي بيطلب منك تشجع فريقك يطرحوا أفكار مجنونة وخارج الصندوق.
            
            الخلاصة: اسمح بالتجربة، كسر القواعد التقليدية، وابحث دائماً عن طرق جديدة ومبتكرة لتقديم الخدمات الأكاديمية لتبقي اسمك بالصدارة دائماً.`,

            `🔥 [هوك]: إذا هدفك مو مكتوب ومحدد بزمن.. فانت عم تبيع هواء!
            
            التفاصيل: طموحاتنا التدريبية العظيمة بتضل مجرد أحلام ليلية إذا ما تحولت لأهداف ذكية (SMART): محددة، قابلة للقياس، واقعية، ومربوطة بجدول زمني صارم ومحسوب.
            
            الخلاصة: حدد بدقة وين بدك توصل هالشهر، كم متدرب بدك تدرب، وشو النتيجة اللي رح تحققها. الأرقام الواضحة بتسهل عليك اتخاذ القرار وبتمنع التشتت.`,

            `🔥 [هوك]: الجودة الحقيقية ما بتنباع بإعلان براق ولا بشهادة معلقة عالحائط!
            
            التفاصيل: معايير الجودة الشاملة هي ثقافة عمل يومية بتظهر بكل تفصيل صغير داخل المركز التدريبي؛ من لحظة استقبال الدارس بالاستقبال ولغاية تقييم البرنامج بنهايته.
            
            الخلاصة: اجعل الجودة هي هويتك الحقيقية. راقب كل تفصيلة، اسمع لعملائك، وحسّن خدماتك باستمرار لتترك انطباعاً راقياً لا يُنسى أبداً.`,

            `🔥 [هوك]: المدرب الذكي هو اللي بيكتم صوته وبيخلي أذنيه هم اللي بيشتغلوا!
            
            التفاصيل: معظم المدربين بيعتقدوا أن شطارتهم تكمن في كثرة الكلام والشرح الطويل. الحقيقة العكس تماماً! الاستماع النشط والإنصات العميق لأسئلة ومخاوف المتدربين هو السر الحقيقي للنجاح.
            
            الخلاصة: اسمع لجمهورك بقلبك وعقلك، واعرف تماماً شو بيحتاجوا قبل ما تجاوب. تواصلك الفعال يبدأ من حسن إنصاتك مش من بلاغة كلامك.`,

            `🔥 [هوك]: كلنا عنا 24 ساعة باليوم.. ليش فلان بينجز أضعافك بكتير؟
            
            التفاصيل: السر عمره ما كان بعدد الساعات، بل بطريقة إدارتك لأولوياتك اليومية. تخلص فوراً من المشتتات الرقمية، خصص وقتاً مركزاً للإنجاز، واعرف أمتى تقول 'لا' للأمور التافهة.
            
            الخلاصة: نظم وقتك بذكاء، امنح نفسك مساحة للراحة لتجديد النشاط، وشوف كيف رح تتضاعف إنتاجيتك وتحس أنك مسيطر على حياتك المهنية.`,

            `🔥 [هوك]: ذكائك الأكاديمي بيوصلك للوظيفة.. بس ذكائك العاطفي هو اللي بيكتب مستقبلك!
            
            التفاصيل: مهاراتك التقنية وحدها لا تكفي للنجاح بالقيادة. الذكاء العاطفي (EQ) هو قدرتك على فهم مشاعرك، التحكم بانفعالاتك، واستيعاب مشاعر ومخاوف اللي حولك باحترافية تامة.
            
            الخلاصة: ابن علاقات مهنية قائمة على التعاطف والذكاء الاجتماعي. بيئة العمل الهادئة والمنتجة تبدأ من قائد بيعرف يدير مشاعره ومشاعر فريقه بحكمة.`,

            `🔥 [هوك]: أعظم تطور مهني بصير لما تطفى الأنوار وتقعد مع حالك خمس دقايق!
            
            التفاصيل: التعلم التأملي هو أنك تراجع يومك بصراحة تامة: وين أخطأت؟ شو كان فيك تعمل أحسن؟ هاي الوقفة البسيطة بتختصر عليك سنين من تكرار نفس الأخطاء الغبية.
            
            الخلاصة: لا تمضي أيامك على عجل بدون تقييم. خصص دقائق آخر كل يوم لمراجعة تجربتك، واصنع بنفسك خططك التصحيحية للوصول للقمة.`,

            `🔥 [هوك]: إذا اختباراتك بتعتمد على الحفظ المؤقت.. فانت ما بتقيس شي أبداً!
            
            التفاصيل: الاختبار الضعيف بيعطي نتيجة وهمية عن مستوى المتدرب. اصنع أدوات تقييم واختبارات ذكية تقيس الفهم العميق، التحليل، والقدرة على تطبيق المعلومة بميدان العمل.
            
            الخلاصة: لا تكتفِ بأسئلة الاختيار من متعدد السطحية. اختبر عقولهم، قدراتهم النقدية، وحلهم للمشكلات لتتأكد أن النجاح كان عن استحقاق وجدارة.`,

            `🔥 [هوك]: ليش دماغ الإنسان بيعشق القصص وبيهرب من الجداول والأرقام؟
            
            التفاصيل: لأن عقلنا مبرمج بالفطرة ليتفاعل مع الحكايات والقصص الواقعية أكثر من الجفاف النظري. لما تربط المادة العلمية بقصة نجاح أو تجربة حية، بتثبت بالعقل للأبد.
            
            الخلاصة: لا تقدم معلومات جافة ومجردة. استخدم فن السرد (Storytelling) بكل محاضراتك، وخلي المتدرب يعيش الفكرة كقصة نجاح ملهمة ومؤثرة.`,

            `🔥 [هوك]: أقوى دورة تدريبية بالتاريخ رح تفشل.. إذا ما حدا سمع عنها!
            
            التفاصيل: فكرة أن "الجودة بتبيع حالها" هي خرافة قديمة. لازم تعرف كيف توصل قيمة برنامجك التدريبي للجمهور المستهدف عبر استراتيجيات تسويق رقمية واضحة ومدروسة.
            
            الخلاصة: استثمر بالتسويق الصح، ابرز الفوائد المهارية الحقيقية لدورتك، ووصل صوتك لكل شخص بحاجة ماسة ليتطور ويثبت حاله بمسيرته.`,

            `🔥 [هوك]: الخوف قبل ما تطلع عالبوديوم أمر طبيعي.. السر وين؟
            
            التفاصيل: رهبة الجمهور وقلق الصعود بتصيب حتى الخبراء. الفارق الحقيقي مش بعدم الخوف، بل بقدرتك على امتصاص هالطاقة وعكسها لحماس وثقة طاغية تجذب كل الحاضرين.
            
            الخلاصة: حضر مقدمتك كويس، تنفس بعيق، وادخل بثقة. الحضور الطاغى والواثق بيمسح أي ارتباك وبيخلي الناس تسمعك بشغف وانتباه كامل.`,

            `🔥 [هوك]: الموظف ما بينتمي للمؤسسة عشان الراتب.. بينتمي لها لهالسبب!
            
            التفاصيل: الولاء الوظيفي الحقيقي بينبنى على التقدير المعنوي، الشعور بالأمان، والإحساس بأنك شريك حقيقي بنجاح هالمكان وتطوره مش مجرد رقم بقوائم الرواتب.
            
            الخلاصة: اعتنِ بفريقك، قدّر جهودهم، واجعلهم يشعرون أن نجاح الأكاديمية هو نجاح شخصي لكل فرد منهم، وساعتها شوف الإخلاص والعطاء المطلق.`,

            `🔥 [هوك]: لما تسكر الأبواب بوجه الحلول العقلانية.. بيجي دور العصف المجنون!
            
            التفاصيل: جلسات العصف الذهني الحقيقية مش هي اللي بيتم فيها نقد الأفكار فوراً. العصف الناجح بيطلب طرح أغرب وأجرأ الأفكار بدون أي قيود، ومن قلب هالأفكار بتطلع الحلول العبقرية.
            
            الخلاصة: شجع فريقك على الإبداع الحر. لا تحبط أي فكرة بغض النظر عن غرابتها بباكورة النقاش، وخلي العقول تبتكر بحرية تامة.`,

            `🔥 [هوك]: التدريب أونلاين مو معناه تنوم العالم وراك خلف الشاشات!
            
            التفاصيل: التدريب الافتراضي بيواجه تحدي كبير بالمشتتات المنزلية. عشان تحافظ على انتباههم، لازم تستخدم أدوات تفاعلية حية، تطرح أسئلة مفاجئة، وتقسم وقتك لفقرات قصيرة.
            
            الخلاصة: خلي عيونهم معلقة عالشاشة من أول دقيقة لأخبرها. التفاعل المستمر هو السر اللي بيخلي دورات أونلاين أنجح من القاعات أحياناً.`,

            `🔥 [هوك]: بكل قاعة رح تواجه 'المجادل والمزعج'.. هيك تتعامل معه بحكمة!
            
            التفاصيل: الشخصيات بالقاعات التدريبية متفرقة؛ الهادئ، المعترض، والمشاكس. المدرب الضعيف بينزعج ويفقد أعصابه، بينما المدرب المحترف بيمتص الموقف بذكاء وبدون إحراج لأحد.
            
            الخلاصة: حول اعتراض المتدرب إلى مادة للنقاش الإيجابي. لا تاخذ الأمور بشكل شخصي، وخلّي ذكائك الاجتماعي هو المسيطر على قاعتك دائماً.`,

            `🔥 [هوك]: سر نجاح كبرى المؤسسات الأكاديمية مبني على الكلمة هاي!
            
            التفاصيل: تمكين القيادات النسائية وإتاحة الفرص المتكافئة ليس رفاهية، بل ضرورة إدارية أثبتت أن التعاطف القيادي وإدارة الأزمات بتتم بأعلى كفاءة واحترافية ممكنة.
            
            الخلاصة: ادعم الكفاءات المتميزة بدون أي تمييز، وامنح الصلاحيات الحقيقية لمن يستحقها، وشوف كيف رح ترتفع جودة الأداء والانتاجية أضعاف مضاعفة.`,

            `🔥 [هوك]: الأكاديمية اللي بتعزل حالها عن السوق.. محكوم عليها بالفشل!
            
            التفاصيل: ما فينا نصمم مناهج بمعزل عن واقع الشركات ومؤسسات الأعمال. جسر الشراكة الحقيقي بين الأكاديمية وسوق العمل هو اللي بيضمن تدريب حقيقي وتوظيف مباشر للخريجين.
            
            الخلاصة: افتح أبواب التعاون مع الشركات، افهم شو بطلبوا، وبني برامجك بناءً على احتياجاتهم الفعلية لتكون دائماً بالقمة والريادة.`,

            `🔥 [هوك]: عطني مشروع حقيقي أنفذه بإيدي.. وخذ مني مهارة ما بتنسى!
            
            التفاصيل: التعلم بالمشروعات الميدانية هو أقصر طريق لإدخال المعرفة لعقل المتدرب وتثبيتها. النظري لحاله بينسى، بس التطبيق العملي بيصنع خبرة حقيقية وملموسة.
            
            الخلاصة: اربط كل دورة أو مساق بمشروع عملي يشتغله المتدرب بنفسه. النتائج رح تدهشك وثقة الدارس بنفسه رح تتضاعف فوراً.`,

            `🔥 [هوك]: التنوع الثقافي بالقاعات مو مشكلة.. هو الكنز الخفي!
            
            التفاصيل: لما تجمع أشخاص من خلفيات وثقافات مختلفة بقاعة وحدة، بيصير عندك انفجار معرفي وآراء غنية بتوسع المدارك وبتخلق حلول إبداعية ما كانت تخطر على بال.
            
            Fالخلاصة: لا تخف من الاختلافات بين المتدربين، بل استثمرها بذكاء لتبني روح الفريق الواحد وتثري نقاشاتكم بأجمل الأفكار والتجارب.`,

            `🔥 [هوك]: بدون حوكمة واضحة وصارمة.. مؤسستك رح تغرق بالفوضى!
            
            التفاصيل: الشفافية، الوضوح، والأنظمة الإدارية المحكمة هي صمام الأمان لأي أكاديمية تسعى للنمو المستدام. غياب الحوكمة بيعني فتح باب للقرارات العشوائية والتخبط.
            
            الخلاصة: ضع لوائح واضحة، وزع الصلاحيات بإنصاف، والتزم بالمعايير الإدارية السليمة لتضمن استقرار الأكاديمية وتقدمها بثبات نحو المستقبل.`,

            `🔥 [هوك]: وظيفتك الحالية ممكن تختفي بكرة.. هل أنت جاهز؟
            
            التفاصيل: التطور التقني السريع عم ينهي وظائف ويخلق غيرها. برامج إعادة التأهيل المهني (Reskilling) هي طوق النجاة اللي بيكسبك مهارات جديدة لتدضل بالصدارة دائماً.
            
            الخلاصة: لا تركن لشهادتك القديمة. طوّر نفسك باستمرار، اكتسب مهارات جديدة تواكب عصر الذكاء والمستقبل، وكن دائماً جاهز للتحول.`,

            `🔥 [هوك]: ليش الموظف الشاطر بيترك شركتك؟ الإجابة بتوجع بس حقيقية!
            
            التفاصيل: غياب المسار الوظيفي الواضح هو السبب الأول لهجرة الكفاءات. لما الموظف ما يشوف قدامه خطة ترقي وتطور واضحة، رح يبحث فوراً عن مكان يقدر طاقاته.
            
            الخلاصة: ارسم لكل موظف متميز مساراً واضحاً لمستقبله الوظيفي معنا. اجعله يرى خطوة بخطوة كيف رح يتطور ويترقى، لضمان بقائه معك بإخلاص.`,

            `🔥 [هوك]: تخلص من الأوراق والملفات.. عصر الإدارة اليدوية انتهى!
            
            التفاصيل: أتمتة العمليات والأرشفة الرقمية مو مجرد مظهر حضاري، هي أداة بتوفر ساعات طويلة من الجهد الضائع وبتسمح لك تركز على الإبداع والتطوير الاستراتيجي.
            
            الخلاصة: حول كل عملياتك الأكاديمية لأنظمة رقمية ذكية. السرعة، الدقة، وسهولة الوصول للمعلومة هي عنوان الأكاديميات الحديثة والناجحة.`,

            `🔥 [هوك]: الخلاف بالرأي مو حرب.. هو السر الحقيقي لتطوير الأعمال!
            
            التفاصيل: الصراعات الشخصية بتهدم المؤسسات، بس الخلافات المنهجية البناءة بالرأي هي اللي بتخلق الحلول الأقوى. تعلم كيف تدير الحوار بحكمة لتصل لتوافق يخدم العمل.
            
            الخلاصة: لا تخف من النقاش الحاد إذا كان الهدف مصلحة العمل. احترم الرأي الآخر، افهم دوافعه، واصنعوا معاً القرارات الأكثر نضجاً وقوة.`,

            `🔥 [هوك]: وين إنجازاتك؟ إذا ما وثقتها بملف مهني.. ما حدا رح يعرف قيمتك!
            
            التفاصيل: السوق لا يعترف بالمهارات الخفية. بناء هويتك المهنية وتوثيق كل دورة، مشروع، وإنجاز حققته بملف (Portfolio) احترافي هو بطاقتك الأقوى للنجاح والانتشار.
            
            The Summary: نظم خبراتك، اظهر إنجازاتك بفخر، وخلّي العالم يشوف قيمتك الحقيقية واحترافيتك العالية لتكون الخيار الأول دائماً.`,

            `🔥 [هوك]: بدك تضاعف سرعة استيعابك للمعلومات بأضعاف مضاعفة؟ اسمع هون!
            
            التفاصيل: علوم الدماغ الحديثة طورت تقنيات 'التعلم السريع' (Accelerated Learning) اللي بتخليك تكتسب مهارات جديدة بأوقات قياسية وبدون إرهاق ذهني طويل.
            
            الخلاصة: اتبع الطرق العلمية الحديثة بالقراءة والاستيعاب، واختصر على حالك شهور طويلة من الجهد البطيء والتقليدي نحو التميز.`,

            `🔥 [هوك]: الشغل حلو.. بس الاحتراق الوظيفي بيقتل شغفك للأبد!
            
            التفاصيل: العمل المتواصل بدون راحة مش بطولة، هو انتحار بطيء لطاقتك الإبداعية. نظم وقتك، افصل حياتك الشخصية، واهتم بصحتك النفسية لتقضل قادر تعطي بتميز.
            
            الخلاصة: خذ استراحات حقيقية، ضع حدوداً واضحة لضغط العمل، وتذكر دائماً أنك بحاجة لصحة عقلية وبدنية سليمة لتستمر برحلة النجاح.`,

            `🔥 [هوك]: لا تخلي نجاح المؤسسة مربوط بشخص واحد مهما كان عبقري!
            
            التفاصيل: غياب أدلة العمل المكتوبة (SOPs) بيعني أنك بمجرد ما تفقد موظف، رح يوقف الشغل. وثق كل سياساتك وإجراءاتك بدقة لضمان استمرارية العمل بسلاسة تامة.
            
            الخلاصة: ابنِ أنظمة لا تعتمد على الأشخاص. اجعل كل خطوة إدارية واضحة وموثوقة، لحتى يضل المركز يشتغل بكفاءة عالية مهما تغيرت الأسماء.`,

            `🔥 [هوك]: لا تنتظر المستقبل لحتى يداهمك.. اصنعه من هلق!
            
            التفاصيل: المؤسسات الرائدة مش هي اللي بتتفاعل مع الحدث، بل هي اللي بتستشرف المستقبل وتقرأ مؤشراته المبكرة لتجهز مهاراتها وتقنياتها من اليوم.
            
            الخلاصة: انظر دائماً للأمام، ادرس الاتجاهات العالمية القادمة، وجهز أكاديميتك لتكون دائماً في مقدمة الصفوف والريادة بلا منازع.`,

            `🔥 [هوك]: رحلة التميز الأكاديمي ما بتنتهي بنقطة.. هاي هي رسالتي الأخيرة!
            
            التفاصيل: طوال رحلتنا استعرضنا أسرار الإدارة، التدريب، وبناء الكوادر. التميز مش صدفة، هو التزام مستمر بالأمانة، الجودة، وصناعة أثر حقيقي ومستدام بالمجتمع.
            
            الخلاصة: أنا رضا الحجي، بختم معكم هاي السلسلة برسالة وحدة: ابقوا مؤمنين بشغفكم، طوروا عقولكم، وكونوا دائماً صناعاً حقيقيين لمستقبل أفضل. شكراً لمتابعتكم!`
        ];

        const container = document.getElementById('videosContainer');

        for (let i = 1; i <= 50; i++) {
            container.innerHTML += `
                <div class="video-card">
                    <span class="badge">🎬 حلقة ريلز فيروسية (${i}) - 9:16</span>
                    <div class="video-content">
                        <h2 class="video-title">بودكاست حلقة رقم ${i}</h2>
                        <div class="script-box" id="script-${i}">
                            ${extendedViralScripts[i - 1]}
                        </div>
                    </div>
                    <button class="copy-btn" onclick="copyScript('script-${i}')">نسخ السكريبت الفيروسي الطويل 📋</button>
                </div>
            `;
        }

        function copyScript(elementId) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('✅ تم نسخ السكريبت الفيروسي مع الهوك بنجاح!');
            }).catch(err => {
                alert('❌ حدث خطأ أثناء النسخ.');
            });
        }
    </script>
</body>
</html>
