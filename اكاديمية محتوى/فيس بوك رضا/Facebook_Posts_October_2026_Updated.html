    <script>
        const posts = [{"day": 1, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nموضوعنا اليوم هو أهمية أوامر التنفيذ الفوري. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 1, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nبعد يوم حافل، من الجيد أن نتوقف لنراجع كيف تعاملنا مع أهمية أوامر التنفيذ الفوري. الأخطاء هي دروس، تأكد من استيعابها.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 2, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nسر النجاح اليوم يكمن في تطبيق كيفية إتقان التحليل الفني. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 2, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nبعد يوم حافل، من الجيد أن نتوقف لنراجع كيف تعاملنا مع كيفية إتقان التحليل الفني. الأخطاء هي دروس، تأكد من استيعابها.\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 3, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nهل فكرت يوماً في أبرز الأخطاء في مؤشر القوة النسبية (RSI)؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 3, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nمراجعة أداءنا في أبرز الأخطاء في مؤشر القوة النسبية (RSI) اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nكيف تقيمون أداءكم ونفسيتكم اليوم من 10؟\n\n#تعلم_التداول #فوركس"}, {"day": 4, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nاليوم سنولي اهتماماً خاصاً لـ أهمية النماذج الفنية الكلاسيكية. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nراقبوا السوق بحذر واقتنصوا الفرص الواضحة فقط.\n\n#EnterPoint_Academy #تداول"}, {"day": 4, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nجلسة اليوم كانت فرصة لاختبار مهاراتنا في أهمية النماذج الفنية الكلاسيكية. تقييم أدائك بصدق هو الخطوة الأولى نحو الاحتراف.\n\nكيف تقيمون أداءكم ونفسيتكم اليوم من 10؟\n\n#تعلم_التداول #فوركس"}, {"day": 5, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nدرسنا اليوم يركز على كيفية إتقان حماية الأرباح (Trailing Stop). لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nكيف ترون اتجاه السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 5, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nخلاصة اليوم: التعامل مع كيفية إتقان حماية الأرباح (Trailing Stop) يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nتصبحون على خيارات أذكى وأرباح أكثر.\n\n#تعلم_التداول #فوركس"}, {"day": 6, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nسر النجاح اليوم يكمن في تطبيق كيفية إتقان تطوير الصبر. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 6, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nبعد يوم حافل، من الجيد أن نتوقف لنراجع كيف تعاملنا مع كيفية إتقان تطوير الصبر. الأخطاء هي دروس، تأكد من استيعابها.\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 7, "type": "morning", "text": "☀️ يوم جديد، فرص جديدة للتعلم والربح 💡\n\nالتميز في التداول يتطلب فهم أهمية المرونة مع تغيرات السوق. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nراقبوا السوق بحذر واقتنصوا الفرص الواضحة فقط.\n\n#EnterPoint_Academy #تداول"}, {"day": 7, "type": "evening", "text": "🌙 انتهت جلسة اليوم! حان وقت الراحة 🏁\n\nجلسة اليوم كانت فرصة لاختبار مهاراتنا في أهمية المرونة مع تغيرات السوق. تقييم أدائك بصدق هو الخطوة الأولى نحو الاحتراف.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 8, "type": "morning", "text": "☀️ مرحباً بكم في جلسة تداول جديدة 📊\n\nاليوم سنولي اهتماماً خاصاً لـ أبرز الأخطاء في النماذج الفنية الكلاسيكية. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nتذكروا دائماً: إدارة المخاطر تأتي أولاً.\n\n#EnterPoint_Academy #تداول"}, {"day": 8, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ أبرز الأخطاء في النماذج الفنية الكلاسيكية. هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 9, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nالتميز في التداول يتطلب فهم أهمية الرافعة المالية. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nراقبوا السوق بحذر واقتنصوا الفرص الواضحة فقط.\n\n#EnterPoint_Academy #تداول"}, {"day": 9, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nنأمل أن يكون درس اليوم حول أهمية الرافعة المالية قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nاكتبوا لنا في التعليقات أهم درس تعلمتوه اليوم.\n\n#تعلم_التداول #فوركس"}, {"day": 10, "type": "morning", "text": "☀️ مرحباً بكم في جلسة تداول جديدة 📊\n\nاليوم سنولي اهتماماً خاصاً لـ أبرز الأخطاء في تجنب الانتقام من السوق. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nدعونا نلتزم بخطتنا ولا ندع العواطف تسيطر.\n\n#EnterPoint_Academy #تداول"}, {"day": 10, "type": "evening", "text": "🌙 جلسة تداول انتهت، ودروس جديدة أضفناها لرصيدنا 💡\n\nاليوم ركزنا على أبرز الأخطاء في تجنب الانتقام من السوق. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 11, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nسر النجاح اليوم يكمن في تطبيق أبرز الأخطاء في قراءة حجم التداول (Volume). التحضير المسبق هو ما يفصلك عن الخسارة.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 11, "type": "evening", "text": "🌙 حصاد اليوم في الأسواق المالية 🌾\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أبرز الأخطاء في قراءة حجم التداول (Volume) كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 12, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nنصيحة اليوم تدور حول أهمية تتبع الترند الصاعد. تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 12, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أهمية تتبع الترند الصاعد كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 13, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nموضوعنا اليوم هو أبرز الأخطاء في أهمية الاستراحة والابتعاد عن الشاشة. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nدعونا نلتزم بخطتنا ولا ندع العواطف تسيطر.\n\n#EnterPoint_Academy #تداول"}, {"day": 13, "type": "evening", "text": "🌙 حصاد اليوم في الأسواق المالية 🌾\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في أهمية الاستراحة والابتعاد عن الشاشة قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 14, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nهل فكرت يوماً في أبرز الأخطاء في التداول المتأرجح (Swing)؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nانضباطك اليوم هو أرباحك في الغد.\n\n#EnterPoint_Academy #تداول"}, {"day": 14, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nاليوم ركزنا على أبرز الأخطاء في التداول المتأرجح (Swing). المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 15, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nموضوعنا اليوم هو أبرز الأخطاء في سجل التداول (Journal). إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 15, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nجلسة اليوم كانت فرصة لاختبار مهاراتنا في أبرز الأخطاء في سجل التداول (Journal). تقييم أدائك بصدق هو الخطوة الأولى نحو الاحتراف.\n\nكيف تقيمون أداءكم ونفسيتكم اليوم من 10؟\n\n#تعلم_التداول #فوركس"}, {"day": 16, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nموضوعنا اليوم هو كيفية إتقان تحليل الأطر الزمنية المتعددة. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nشاركنا رأيك أو تحليلك في التعليقات.\n\n#EnterPoint_Academy #تداول"}, {"day": 16, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nمراجعة أداءنا في كيفية إتقان تحليل الأطر الزمنية المتعددة اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nتصبحون على خيارات أذكى وأرباح أكثر.\n\n#تعلم_التداول #فوركس"}, {"day": 17, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nالتميز في التداول يتطلب فهم أبرز الأخطاء في حساب العمولات. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 17, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أبرز الأخطاء في حساب العمولات كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 18, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nفي جلسة اليوم، نركز على كيفية إتقان الالتزام بالخطة المكتوبة. راقب كيف يتفاعل السوق مع هذا العنصر وحاول استغلاله لصالحك بدقة.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 18, "type": "evening", "text": "🌙 مساء الخير متداولينا الأعزاء.\n\nاليوم ركزنا على كيفية إتقان الالتزام بالخطة المكتوبة. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nالراحة الآن ضرورية جداً لنعود بتركيز أعلى غداً.\n\n#تعلم_التداول #فوركس"}, {"day": 19, "type": "morning", "text": "☀️ مرحباً بكم في جلسة تداول جديدة 📊\n\nفي جلسة اليوم، نركز على أهمية نسبة العائد للمخاطرة (R:R). راقب كيف يتفاعل السوق مع هذا العنصر وحاول استغلاله لصالحك بدقة.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 19, "type": "evening", "text": "🌙 مساء الخير متداولينا الأعزاء.\n\nبعد يوم حافل، من الجيد أن نتوقف لنراجع كيف تعاملنا مع أهمية نسبة العائد للمخاطرة (R:R). الأخطاء هي دروس، تأكد من استيعابها.\n\nتصبحون على خيارات أذكى وأرباح أكثر.\n\n#تعلم_التداول #فوركس"}, {"day": 20, "type": "morning", "text": "☀️ صباح الخير يا أبطال Enter Point!\n\nهل فكرت يوماً في أبرز الأخطاء في خطوط الاتجاه (Trendlines)؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nكيف ترون اتجاه السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 20, "type": "evening", "text": "🌙 كيف كان يومكم في الأسواق؟ 📊\n\nخلاصة اليوم: التعامل مع أبرز الأخطاء في خطوط الاتجاه (Trendlines) يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 21, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nنصيحة اليوم تدور حول أهمية سجل التداول (Journal). تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 21, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nمراجعة أداءنا في أهمية سجل التداول (Journal) اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 22, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nفي جلسة اليوم، نركز على كيفية إتقان تأثير السبريد (Spread). راقب كيف يتفاعل السوق مع هذا العنصر وحاول استغلاله لصالحك بدقة.\n\nتذكروا دائماً: إدارة المخاطر تأتي أولاً.\n\n#EnterPoint_Academy #تداول"}, {"day": 22, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ كيفية إتقان تأثير السبريد (Spread). هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 23, "type": "morning", "text": "☀️ صباح الخير يا أبطال Enter Point!\n\nدرسنا اليوم يركز على أبرز الأخطاء في أسعار الفائدة. لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nانضباطك اليوم هو أرباحك في الغد.\n\n#EnterPoint_Academy #تداول"}, {"day": 23, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في أسعار الفائدة قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nتصبحون على خيارات أذكى وأرباح أكثر.\n\n#تعلم_التداول #فوركس"}, {"day": 24, "type": "morning", "text": "☀️ صباح الانضباط والفرص الجديدة 🚀\n\nنصيحة اليوم تدور حول أهمية مؤشر القوة النسبية (RSI). تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 24, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ أهمية مؤشر القوة النسبية (RSI). هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 25, "type": "morning", "text": "☀️ صباح الخير يا أبطال Enter Point!\n\nالتميز في التداول يتطلب فهم كيفية إتقان النماذج الفنية الكلاسيكية. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nراقبوا السوق بحذر واقتنصوا الفرص الواضحة فقط.\n\n#EnterPoint_Academy #تداول"}, {"day": 25, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nمراجعة أداءنا في كيفية إتقان النماذج الفنية الكلاسيكية اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 26, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nالتميز في التداول يتطلب فهم أهمية تأثير افتتاحيات الجلسات. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 26, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nخلاصة اليوم: التعامل مع أهمية تأثير افتتاحيات الجلسات يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 27, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nالتميز في التداول يتطلب فهم كيفية إتقان إدارة رأس المال. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 27, "type": "evening", "text": "🌙 كيف كان يومكم في الأسواق؟ 📊\n\nنأمل أن يكون درس اليوم حول كيفية إتقان إدارة رأس المال قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 28, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nدرسنا اليوم يركز على أبرز الأخطاء في خطة التداول. لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nانضباطك اليوم هو أرباحك في الغد.\n\n#EnterPoint_Academy #تداول"}, {"day": 28, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nخلاصة اليوم: التعامل مع أبرز الأخطاء في خطة التداول يتطلب مرونة وحكمة. هل كنت راضياً عن أدائك اليوم؟\n\nكيف تقيمون أداءكم ونفسيتكم اليوم من 10؟\n\n#تعلم_التداول #فوركس"}, {"day": 29, "type": "morning", "text": "☀️ صباح الطاقة الإيجابية والتركيز العالي 🧠\n\nدرسنا اليوم يركز على أبرز الأخطاء في الخوف من تفويت الفرصة (FOMO). لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 29, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ أبرز الأخطاء في الخوف من تفويت الفرصة (FOMO). هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 30, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nنصيحة اليوم تدور حول أهمية فهم سيكولوجية الحشود. تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 30, "type": "evening", "text": "🌙 جلسة تداول انتهت، ودروس جديدة أضفناها لرصيدنا 💡\n\nنأمل أن يكون درس اليوم حول أهمية فهم سيكولوجية الحشود قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nالراحة الآن ضرورية جداً لنعود بتركيز أعلى غداً.\n\n#تعلم_التداول #فوركس"}];
        function generateDays() {
            const container = document.getElementById('postsContainer');
            const savedState = JSON.parse(localStorage.getItem('fb_posts_10_v2')) || {};
            const days = {};
            posts.forEach(p => { if(!days[p.day]) days[p.day] = {m:null, e:null}; if(p.type==='morning') days[p.day].m=p; else days[p.day].e=p; });
            
            Object.keys(days).sort((a,b)=>a-b).forEach(d => {
                const sec = document.createElement('div'); sec.className = 'day-section';
                sec.innerHTML = `<div class="day-header"><span>اليوم ${d}</span></div><div class="day-posts"></div>`;
                const postsDiv = sec.querySelector('.day-posts');
                [days[d].m, days[d].e].forEach((p, idx) => {
                    const i = (d-1)*2 + idx + 1;
                    const card = document.createElement('div'); card.className = 'post-card' + (savedState[`p-${i}`]?' published':'');
                    card.innerHTML = `<div class="post-published-container"><input type="checkbox" style="width:18px; height:18px; cursor:pointer;" onchange="toggle(this, ${i})" ${savedState[`p-${i}`]?'checked':''}></div>
                    <div><span class="post-time ${p.type}">${p.type==='morning'?'☀️ صباحاً':'🌙 مساءً'}</span></div>
                    <div class="post-text">${p.text.replace(/\n/g, '<br>')}</div>
                    <button class="copy-btn" onclick="copy(${i})">📋 نسخ النص</button><span class="copy-feedback" id="f-${i}">✓ تم النسخ بنجاح</span>`;
                    postsDiv.appendChild(card);
                });
                container.appendChild(sec);
            });
        }
        function toggle(cb, i) {
            cb.parentElement.parentElement.classList.toggle('published', cb.checked);
            const state = JSON.parse(localStorage.getItem('fb_posts_10_v2')) || {};
            state[`p-${i}`] = cb.checked;
            localStorage.setItem('fb_posts_10_v2', JSON.stringify(state));
        }
        function copy(i) {
            navigator.clipboard.writeText(posts[i-1].text).then(() => {
                const f = document.getElementById(`f-${i}`); f.classList.add('show');
                setTimeout(()=>f.classList.remove('show'), 2000);
            });
        }
        generateDays();
    </script>
