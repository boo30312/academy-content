<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <title>منشورات LinkedIn - Enter Point Trading Academy | أكتوبر 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff;
            padding: 0;
            padding-top: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Navbar Header */
        .navbar {
            background: #0f0f1e;
            border-bottom: 2px solid #d4af37;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: nowrap;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .navbar-logo-mark {
            width: 42px;
            height: 42px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #d4af37;
            font-size: 16px;
            letter-spacing: -1px;
            background: rgba(212, 175, 55, 0.08);
            flex-shrink: 0;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .navbar-brand .brand-main {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
        }

        .navbar-brand .brand-main span {
            color: #d4af37;
        }

        .navbar-brand .brand-sub {
            font-size: 10px;
            color: #9e9e9e;
            white-space: nowrap;
        }

        /* Center Nav */
        .navbar-center {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #d4af37;
        }

        .nav-link .chevron {
            font-size: 9px;
            opacity: 0.5;
        }

        /* Left Buttons */
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .nav-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
            white-space: nowrap;
        }

        .nav-pill:hover {
            border-color: #d4af37;
        }

        .nav-pill .pill-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .pill-icon.lang {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }

        .pill-icon.support {
            background: rgba(0, 188, 212, 0.15);
            color: #00bcd4;
        }

        /* News Ticker */
        .news-ticker {
            background: linear-gradient(135deg, #0f1b3a 0%, #1a2d5a 100%);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }

        .news-ticker::before {
            content: 'BREAKING';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #000;
            font-size: 11px;
            font-weight: 900;
            padding: 0 10px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }

        .ticker-content {
            display: flex;
            gap: 40px;
            animation: scroll 30s infinite linear;
            margin-right: 100px;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .ticker-item {
            white-space: nowrap;
            color: #d4af37;
            font-weight: 600;
            font-size: 13px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 20px 25px;
            flex: 1;
            min-width: 150px;
        }

        .stat-label {
            font-size: 12px;
            color: #9e9e9e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: #d4af37;
        }

        /* Day Sections */
        .day-section {
            margin-bottom: 40px;
        }

        .day-section.all-published {
            opacity: 0.6;
        }

        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
            border-radius: 10px 10px 0 0;
            border-bottom: 1px solid #d4af37;
            margin-bottom: 15px;
        }

        .day-header.published {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(76, 175, 80, 0.05) 100%);
            border-bottom-color: #4cb50;
        }

        .day-title {
            font-size: 16px;
            font-weight: 700;
            color: #d4af37;
        }

        .day-header.published .day-title {
            color: #4cb50;
        }

        .day-count {
            font-size: 12px;
            color: #9e9e9e;
        }

        .day-posts {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Post Card */
        .post-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .post-card:hover {
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }

        .post-card.published {
            opacity: 0.5;
            background: linear-gradient(135deg, #1a2e1a 0%, #1e3e1e 100%);
            border-color: #4cb50;
        }

        .post-published-container {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-published-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .post-published-label {
            font-size: 11px;
            color: #9e9e9e;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            margin-top: 5px;
        }

        .post-time {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 5px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
        }

        .post-time.evening {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
        }

        .post-number {
            font-size: 11px;
            color: #9e9e9e;
            font-weight: 600;
        }

        .post-text {
            font-size: 14px;
            line-height: 1.8;
            color: #e0e0e0;
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .hashtags {
            font-size: 11px;
            color: #00bcd4;
            line-height: 1.5;
        }

        .copy-btn {
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Tajawal', sans-serif;
        }

        .copy-btn:hover {
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .copy-feedback {
            font-size: 11px;
            color: #4cb50;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 15px;
            }

            .navbar-center {
                display: none;
            }

            .stat-box {
                min-width: 100%;
            }

            .post-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <div class="nav-pill">
                <span class="pill-icon lang">🌐</span>
                <span>العربية</span>
            </div>
            <div class="nav-pill">
                <span class="pill-icon support">💬</span>
                <span>الدعم</span>
            </div>
        </div>
        <div class="navbar-center">
            <a class="nav-link active">منشورات أكتوبر</a>
            <a class="nav-link">التحليلات</a>
            <a class="nav-link">الأداء</a>
        </div>
        <div class="navbar-right">
            <div class="navbar-logo-mark">EP</div>
            <div class="navbar-brand">
                <span class="brand-main">Enter <span>Point</span></span>
                <span class="brand-sub">Trading Academy</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="news-ticker">
            <div class="ticker-content">
                <span class="ticker-item">📊 منشورات شهر أكتوبر جاهزة للنشر</span>
                <span class="ticker-item">🎯 30 يوم من التطبيق والتطور</span>
                <span class="ticker-item">💎 محتوى متقدم للمتداولين</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-label">منشورات منشورة</span>
                <span class="stat-value" id="totalPublished">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">باقية للنشر</span>
                <span class="stat-value" id="totalRemaining">60</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">نسبة الإنجاز</span>
                <span class="stat-value" id="publishPercentage">0%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">أيام مكتملة</span>
                <span class="stat-value" id="daysCompleted">0</span>
            </div>
        </div>

        <div id="postsContainer"></div>
    </div>

    <script>
        const posts = [
            // Day 1
            { day: 1, type: 'morning', text: 'أكتوبر = شهر الحقيقة.\n\nسبتمبر كان التعليم.\nأكتوبر = التطبيق.\n\nكل اللي تعلمته:\nبتختبره الآن.\n\nالسوق ما يهتم بنظريتك.\nيهتم بنتائجك.\n\n#ExecutionMonth #Reality #EnterPoint' },
            { day: 1, type: 'evening', text: 'مساء الحقيقة الأولى:\n\nأول صفقة في أكتوبر:\nستخبرك كم فعلاً فهمت.\n\nإذا ربحت = ممتاز.\nإذا خسرت = أفضل، هذا تعليم.\n\nالخسارة الأولى = أغلى درس.\n\n#FirstTrade #RealityCheck #EnterPoint' },

            // Day 2
            { day: 2, type: 'morning', text: 'شيء واحد تعلمت:\n\nالفرق بين اللي تقرأ عنه\nواللي تعيشه:\nضخم جداً.\n\nالآن بتعيش.\nبتشعر بكل صفقة.\nبتعاني كل خسارة.\n\nهذا = الواقع.\n\n#TheoryVsReality #Experience #EnterPoint' },
            { day: 2, type: 'evening', text: 'مساء الشعور:\n\nالتداول ليس رقم على الشاشة.\nهو شعور.\nهو قلق.\nهو أمل.\nهو ندم.\nهو فرح.\n\nهذا الشعور = يقويك أو يكسرك.\n\nاختر أنك تقوى.\n\n#Emotions #Psychology #EnterPoint' },

            // Day 3
            { day: 3, type: 'morning', text: 'إذا خسرت في أول يومين:\n\nأنت طبيعي.\n80% يخسرون.\nأنت في الفئة الصحيحة.\n\nالسؤال: هل بتقوم؟\nأم بتنسحب؟\n\nالقيام = بداية الفوز.\n\n#Resilience #Recovery #EnterPoint' },
            { day: 3, type: 'evening', text: 'مساء القيام:\n\nأول خسارة = أول درس حقيقي.\n\nاكتب:\n✓ كم خسرت\n✓ ليش حصل\n✓ كيف تجنبه بعدين\n\nهذا الدفتر = ذهبك.\n\n#Documentation #Learning #EnterPoint' },

            // Day 4
            { day: 4, type: 'morning', text: 'قاعدة جديدة:\n\nكل يوم تتاجر:\nاكتب الدرس.\nما تخزنه في رأسك.\n\nالرأس ينسى.\nالورقة تذكّر.\n\nأكبر ثروة = دفتر أخطائك.\n\n#Documentation #Wisdom #EnterPoint' },
            { day: 4, type: 'evening', text: 'مساء الحكمة المكتوبة:\n\nفي سنة من الآن:\nستشوف دفتر اليوم.\nبتقول: "ما كنت أعرف هذا!"\n\nهذا = التقدم.\n\n#Progress #GrowthTrack #EnterPoint' },

            // Day 5
            { day: 5, type: 'morning', text: 'أكتوبر يوم 5:\n\nسؤال:\nكم صفقة عملت؟\nكم ربحت/خسرت؟\nهل التزمت الخطة؟\n\nإذا ما الالتزمت الخطة:\nأنت ما زلت هاوي.\nالمحترفون = ينضبطون.\n\n#Discipline #Adherence #EnterPoint' },
            { day: 5, type: 'evening', text: 'مساء الالتزام:\n\nالخطة اللي تكتبها:\nتطبقها 100%.\n\nلو جابت خسارة = غير الخطة.\nلكن بعد إنهائك لها.\n\nمتوسط الطريق = فشل.\n\n#CommitmentMatters #Consistency #EnterPoint' },

            // Day 6
            { day: 6, type: 'morning', text: 'حقيقة قاسية:\n\nحسابك الصغير:\nقد يكون بطء اختبار.\nلو ما تحترفها هنا:\nستخسر كبير لما تكبر.\n\nاستخدم الحساب الصغير:\nلتعليم نفسك.\nليس للربح السريع.\n\n#SmallAccountTraining #Discipline #EnterPoint' },
            { day: 6, type: 'evening', text: 'مساء الاختبار:\n\nالحساب الصغير = ملعب الممارسة.\n\nتعلم هنا:\nإدارة المخاطر.\nالانضباط.\nالصبر.\n\nبعدين، كبّر.\n\n#TrainingGround #MastersEducation #EnterPoint' },

            // Day 7
            { day: 7, type: 'morning', text: 'أسبوع واحد في أكتوبر انتهى.\n\nتقييم سريع:\n✓ التزمت الخطة؟\n✓ تعلمت درس؟\n✓ نسبة فوز عندك؟\n\nأجب على الثلاث:\nتعرف وين أنت.\n\n#WeeklyReview #SelfAssessment #EnterPoint' },
            { day: 7, type: 'evening', text: 'مساء التقييم:\n\nأسبوع الأول = بناء الأساس.\n\nإذا ربحت: ممتاز.\nإذا خسرت: أفضل، تعلمت أرخص.\n\nبالأسابيع القادمة:\nستشوف التقدم.\n\n#Foundation #BuildingBlock #EnterPoint' },

            // Day 8
            { day: 8, type: 'morning', text: 'إذا شفت متداول يقول:\n"أنا ما أخطأت أبداً"\n\nأنت تشوف كاذب أو ضعيف.\nأقوى المتداولين:\nيعترفون بأخطائهم.\nويتعلمون منها.\n\n#Honesty #Strength #EnterPoint' },
            { day: 8, type: 'evening', text: 'مساء الاعتراف:\n\nأكبر متداول:\nقال "أنا أخطأت."\n\nأصغر متداول:\nقال "السوق خاطئ."\n\nاختر أن تكون الأول.\n\n#Accountability #Maturity #EnterPoint' },

            // Day 9
            { day: 9, type: 'morning', text: 'الحد الأدنى من الانضباط:\n\n• صفقة واحدة يومياً = كافي\n• سيشاور يومي = خطر\n• تحليل يومي = ضروري\n• تعليم يومي = إجباري\n\nهذا = حد أدنى.\n\n#MinimumRequirement #Discipline #EnterPoint' },
            { day: 9, type: 'evening', text: 'مساء الحد الأدنى:\n\nإذا ما التزمت الحد الأدنى:\nما بدك تتفاجأ من الفشل.\n\nالمحترفون = يفعلون الحد الأدنى يومياً.\n\nالفرق كبير جداً.\n\n#DailyHabits #Excellence #EnterPoint' },

            // Day 10
            { day: 10, type: 'morning', text: 'عشرة أيام من أكتوبر.\nثلثين الشهر.\n\nسؤال صعب:\nهل أنت أفضل من اليوم الأول؟\n\nإذا الإجابة لا:\nغير الخطة الآن.\nلا تكملها.\n\nالوقت = أغلى من المال.\n\n#Progress #Time #EnterPoint' },
            { day: 10, type: 'evening', text: 'مساء التقييم النصفي:\n\nلو ما اتقدمت بأسبوع:\nغير شيء.\n\nلو اتقدمت شوي:\nاستمر بنفس الطريق.\n\nالمرونة + الانضباط = النجاح.\n\n#Flexibility #Adaptation #EnterPoint' },

            // Day 11
            { day: 11, type: 'morning', text: 'معادلة النجاح الحقيقية:\n\nموهبة = 20%\nعمل = 80%\n\nأنت ما تحتاج موهبة.\nتحتاج عمل فقط.\n\n80% عمل = تكفي.\n\n#HardWork #Dedication #EnterPoint' },
            { day: 11, type: 'evening', text: 'مساء العمل:\n\nالموهوبين بلا عمل = فاشلين.\nالعاديين مع عمل = ناجحين.\n\nأختر أن تكون عادي + عامل.\n\n#WorkEthic #Success #EnterPoint' },

            // Day 12
            { day: 12, type: 'morning', text: 'حد كبير من المتداولين:\n\nتوقعهم = عالي.\nصبرهم = منخفض.\n\nهذا = وصفة الفشل.\n\nأقلل التوقعات.\nزيّد الصبر.\nشوف ايش بيحصل.\n\n#Patience #Expectations #EnterPoint' },
            { day: 12, type: 'evening', text: 'مساء الصبر:\n\nصبر = ثروة المتداول.\n\nالناس يريدون الملايين باليوم.\nالمتداول الحقيقي = يريد الاستقرار.\n\nاختر الاستقرار.\n\n#Wisdom #LongTerm #EnterPoint' },

            // Day 13
            { day: 13, type: 'morning', text: 'رقم 13:\nبعض يقول نحس.\n\nأنا أقول: فرصة.\n\n13 يوم = تعلمت حاجات كتيرة.\n13 يوم = بنيت عادات.\n13 يوم = أقرب للاحتراف.\n\nهذا ليس نحس.\nهذا = تقدم.\n\n#Progress #Superstition #EnterPoint' },
            { day: 13, type: 'evening', text: 'مساء الحقيقة:\n\nليس النحس يحدد مستقبلك.\nأفعالك هي.\n\nكل يوم تختار:\nتتعلم أو تخسر.\n\nاختيارك، ليس الحظ.\n\n#ChoiceMatters #Responsibility #EnterPoint' },

            // Day 14
            { day: 14, type: 'morning', text: 'نص الشهر = فترة حساسة.\n\nالمتداولون المجتهدون:\nبدأوا يشوفوا نتائج.\n\nالمتداولون الكسالى:\nبدأوا يفكروا بالاستسلام.\n\nأنت أي فريق؟\n\n#Midpoint #Commitment #EnterPoint' },
            { day: 14, type: 'evening', text: 'مساء الاختبار الحقيقي:\n\nنص الشهر:\nحيث يظهر من فعلاً يريد.\nومن جاي يضيع وقته.\n\nأظهر نفسك.\n\n#TrueNature #Character #EnterPoint' },

            // Day 15
            { day: 15, type: 'morning', text: 'شيء جميل عن النصف الثاني:\n\nأنت الآن:\nعرفت أخطاءك.\nعرفت نقاط قوتك.\n\nالنصف الثاني:\nبتستخدمها بحكمة.\n\nهذا = فرصة ذهب.\n\n#SecondHalf #Wisdom #EnterPoint' },

        // Group posts by day
        function generateDays() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            const days = {};
            posts.forEach(post => {
                if (!days[post.day]) {
                    days[post.day] = { morning: null, evening: null };
                }
                days[post.day][post.type] = post;
            });

            Object.keys(days).sort((a, b) => a - b).forEach(dayNum => {
                const dayData = days[dayNum];
                const daySection = document.createElement('div');
                daySection.className = 'day-section';
                daySection.id = `day-${dayNum}`;

                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.innerHTML = `
                    <span class="day-title">اليوم ${dayNum}</span>
                    <span class="day-count">منشورات: 2</span>
                `;

                const dayPosts = document.createElement('div');
                dayPosts.className = 'day-posts';

                // Morning post
                if (dayData.morning) {
                    dayPosts.appendChild(createPostCard(dayData.morning, dayNum * 2 - 1));
                }

                // Evening post
                if (dayData.evening) {
                    dayPosts.appendChild(createPostCard(dayData.evening, dayNum * 2));
                }

                daySection.appendChild(dayHeader);
                daySection.appendChild(dayPosts);
                container.appendChild(daySection);
            });

            updateStats();
        }

        function createPostCard(post, index) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.id = `post-${index}`;

            const timeClass = post.type === 'morning' ? 'morning' : 'evening';
            const timeText = post.type === 'morning' ? '☀️ صباحاً' : '🌙 مساءً';

            card.innerHTML = `
                <div class="post-published-container">
                    <input type="checkbox" class="post-published-checkbox" onchange="togglePublished(${index})">
                    <span class="post-published-label"></span>
                </div>
                <div class="post-header">
                    <span class="post-time ${timeClass}">${timeText}</span>
                    <span class="post-number">#${index}</span>
                </div>
                <div class="post-text">${escapeHtml(post.text)}</div>
                <div class="post-footer">
                    <div class="hashtags">#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji #StockMarket #InvestmentStrategy</div>
                    <button class="copy-btn" onclick="copyPost(${index})">📋 نسخ النص</button>
                    <span class="copy-feedback" id="feedback-${index}">✓ تم النسخ</span>
                </div>
            `;

            return card;
        }

        function togglePublished(index) {
            const card = document.getElementById(`post-${index}`);
            const checkbox = card.querySelector('.post-published-checkbox');
            
            card.classList.toggle('published', checkbox.checked);

            // Check if day is complete
            const postNumber = index;
            const dayNum = Math.ceil(postNumber / 2);
            const daySection = document.getElementById(`day-${dayNum}`);
            
            const dayCheckboxes = daySection.querySelectorAll('.post-published-checkbox');
            const allChecked = Array.from(dayCheckboxes).every(cb => cb.checked);
            
            const dayHeader = daySection.querySelector('.day-header');
            dayHeader.classList.toggle('published', allChecked);
            daySection.classList.toggle('all-published', allChecked);

            updateStats();
        }

        function updateStats() {
            const allCheckboxes = document.querySelectorAll('.post-published-checkbox');
            const checkedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
            const totalCount = allCheckboxes.length;
            const remainingCount = totalCount - checkedCount;
            const percentage = Math.round((checkedCount / totalCount) * 100);

            const completedDays = Array.from(document.querySelectorAll('.day-section.all-published')).length;

            document.getElementById('totalPublished').textContent = checkedCount;
            document.getElementById('totalRemaining').textContent = remainingCount;
            document.getElementById('publishPercentage').textContent = percentage + '%';
            document.getElementById('daysCompleted').textContent = completedDays;
        }

        function copyPost(index) {
            const post = posts[index - 1];
            const fullText = `${post.text}\n\n#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji #StockMarket #InvestmentStrategy\n\nhttps://www.enterpoint.online/`;
            
            navigator.clipboard.writeText(fullText).then(() => {
                const feedback = document.getElementById(`feedback-${index}`);
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('حدث خطأ في النسخ');
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        generateDays();
    </script>
