    <script>
        const posts = [{"day": 1, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nهل فكرت يوماً في أبرز الأخطاء في حماية الأرباح (Trailing Stop)؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nهل أنتم مستعدون لتحديات السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 1, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أبرز الأخطاء في حماية الأرباح (Trailing Stop) كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 2, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nموضوعنا اليوم هو أبرز الأخطاء في تأثير افتتاحيات الجلسات. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nراقبوا السوق بحذر واقتنصوا الفرص الواضحة فقط.\n\n#EnterPoint_Academy #تداول"}, {"day": 2, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ أبرز الأخطاء في تأثير افتتاحيات الجلسات. هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 3, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nفي جلسة اليوم، نركز على أبرز الأخطاء في جني الأرباح. راقب كيف يتفاعل السوق مع هذا العنصر وحاول استغلاله لصالحك بدقة.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 3, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nجلسة اليوم كانت فرصة لاختبار مهاراتنا في أبرز الأخطاء في جني الأرباح. تقييم أدائك بصدق هو الخطوة الأولى نحو الاحتراف.\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 4, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nنصيحة اليوم تدور حول أهمية جني الأرباح. تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 4, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أهمية جني الأرباح كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nما هو تقييمكم لحركة السوق والسيولة اليوم؟\n\n#تعلم_التداول #فوركس"}, {"day": 5, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nدرسنا اليوم يركز على أبرز الأخطاء في الأخبار الاقتصادية. لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 5, "type": "evening", "text": "🌙 انتهت جلسة اليوم! حان وقت الراحة 🏁\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في الأخبار الاقتصادية قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 6, "type": "morning", "text": "☀️ صباح الخير يا أبطال Enter Point!\n\nموضوعنا اليوم هو أهمية أهمية الاستراحة والابتعاد عن الشاشة. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 6, "type": "evening", "text": "🌙 كيف كان يومكم في الأسواق؟ 📊\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أهمية أهمية الاستراحة والابتعاد عن الشاشة كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 7, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nاليوم سنولي اهتماماً خاصاً لـ أهمية التنويع في الصفقات. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nراقبوا السوق بحذر واقتنصوا الفرص الواضحة فقط.\n\n#EnterPoint_Academy #تداول"}, {"day": 7, "type": "evening", "text": "🌙 مساء الخير متداولينا الأعزاء.\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ أهمية التنويع في الصفقات. هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 8, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nموضوعنا اليوم هو كيفية إتقان خطة التداول. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 8, "type": "evening", "text": "🌙 جلسة تداول انتهت، ودروس جديدة أضفناها لرصيدنا 💡\n\nجلسة اليوم كانت فرصة لاختبار مهاراتنا في كيفية إتقان خطة التداول. تقييم أدائك بصدق هو الخطوة الأولى نحو الاحتراف.\n\nلا تنسوا تدوين كل ملاحظاتكم في سجل التداول الخاص بكم.\n\n#تعلم_التداول #فوركس"}, {"day": 9, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nموضوعنا اليوم هو أهمية السيولة في السوق. إذا تمكنت من إتقان هذا الجانب، ستلاحظ تغييراً كبيراً واستقراراً في نتائجك.\n\nشاركنا رأيك أو تحليلك في التعليقات.\n\n#EnterPoint_Academy #تداول"}, {"day": 9, "type": "evening", "text": "🌙 حصاد اليوم في الأسواق المالية 🌾\n\nاليوم ركزنا على أهمية السيولة في السوق. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nالراحة الآن ضرورية جداً لنعود بتركيز أعلى غداً.\n\n#تعلم_التداول #فوركس"}, {"day": 10, "type": "morning", "text": "☀️ مرحباً بكم في جلسة تداول جديدة 📊\n\nنصيحة اليوم تدور حول أبرز الأخطاء في تأثير السبريد (Spread). تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nهل خطتكم جاهزة لبدء التنفيذ؟\n\n#EnterPoint_Academy #تداول"}, {"day": 10, "type": "evening", "text": "🌙 حصاد اليوم في الأسواق المالية 🌾\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في تأثير السبريد (Spread) قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 11, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nنصيحة اليوم تدور حول أهمية تحديد الأهداف اليومية المنطقية. تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nتذكروا دائماً: إدارة المخاطر تأتي أولاً.\n\n#EnterPoint_Academy #تداول"}, {"day": 11, "type": "evening", "text": "🌙 كيف كان يومكم في الأسواق؟ 📊\n\nنأمل أن يكون درس اليوم حول أهمية تحديد الأهداف اليومية المنطقية قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nاكتبوا لنا في التعليقات أهم درس تعلمتوه اليوم.\n\n#تعلم_التداول #فوركس"}, {"day": 12, "type": "morning", "text": "☀️ إشراقة يوم تداول جديد! استعدوا.\n\nالتميز في التداول يتطلب فهم أهمية استراتيجيات السوق العرضي. اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nدعونا نلتزم بخطتنا ولا ندع العواطف تسيطر.\n\n#EnterPoint_Academy #تداول"}, {"day": 12, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nانتهى يوم التداول، ولكن التعلم لا ينتهي أبداً. تطبيق أهمية استراتيجيات السوق العرضي كان التحدي الأبرز، نأمل أن تكونوا قد استفدتم.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 13, "type": "morning", "text": "☀️ صباح الانضباط والفرص الجديدة 🚀\n\nاليوم سنولي اهتماماً خاصاً لـ كيفية إتقان المتوسطات المتحركة. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nما هي استعداداتكم اليوم؟ شاركونا في التعليقات!\n\n#EnterPoint_Academy #تداول"}, {"day": 13, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nبعد يوم حافل، من الجيد أن نتوقف لنراجع كيف تعاملنا مع كيفية إتقان المتوسطات المتحركة. الأخطاء هي دروس، تأكد من استيعابها.\n\nتصبحون على خيارات أذكى وأرباح أكثر.\n\n#تعلم_التداول #فوركس"}, {"day": 14, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nالتميز في التداول يتطلب فهم كيفية إتقان قراءة حجم التداول (Volume). اجعل هذا المفهوم دليلك في قراءة الشارت اليوم.\n\nشاركنا رأيك أو تحليلك في التعليقات.\n\n#EnterPoint_Academy #تداول"}, {"day": 14, "type": "evening", "text": "🌙 مساء التقييم والمراجعة الصادقة 📝\n\nبعد يوم حافل، من الجيد أن نتوقف لنراجع كيف تعاملنا مع كيفية إتقان قراءة حجم التداول (Volume). الأخطاء هي دروس، تأكد من استيعابها.\n\nاكتبوا لنا في التعليقات أهم درس تعلمتوه اليوم.\n\n#تعلم_التداول #فوركس"}, {"day": 15, "type": "morning", "text": "☀️ مرحباً بكم في جلسة تداول جديدة 📊\n\nاليوم سنولي اهتماماً خاصاً لـ أهمية حماية الأرباح (Trailing Stop). التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 15, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nبينما نغلق شاشات التداول، دعونا نسترجع تطبيقنا لـ أهمية حماية الأرباح (Trailing Stop). هل التزمت بقواعدك أم تغلبت عليك المشاعر؟\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 16, "type": "morning", "text": "☀️ يوم جديد، فرص جديدة للتعلم والربح 💡\n\nاليوم سنولي اهتماماً خاصاً لـ كيفية إتقان التحليل الأساسي. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nراقبوا السوق بحذر واقتنصوا الفرص الواضحة فقط.\n\n#EnterPoint_Academy #تداول"}, {"day": 16, "type": "evening", "text": "🌙 حصاد اليوم في الأسواق المالية 🌾\n\nاليوم ركزنا على كيفية إتقان التحليل الأساسي. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 17, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nهل فكرت يوماً في كيفية إتقان تجنب التداول وقت الأخبار القوية؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nانضباطك اليوم هو أرباحك في الغد.\n\n#EnterPoint_Academy #تداول"}, {"day": 17, "type": "evening", "text": "🌙 نهاية يوم تداول آخر مليء بالدروس 🌙\n\nاليوم ركزنا على كيفية إتقان تجنب التداول وقت الأخبار القوية. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nهل التزمتم بوقف الخسارة أم واجهتم صعوبة؟\n\n#تعلم_التداول #فوركس"}, {"day": 18, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nاليوم سنولي اهتماماً خاصاً لـ أبرز الأخطاء في الدعوم والمقاومات. التزم بقواعدك ولا تتسرع في اتخاذ القرار.\n\nنتمنى لكم صفقات موفقة وخضراء طوال اليوم!\n\n#EnterPoint_Academy #تداول"}, {"day": 18, "type": "evening", "text": "🌙 حصاد اليوم في الأسواق المالية 🌾\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في الدعوم والمقاومات قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nتذكر: الخسارة جزء من اللعبة، الأهم هو كيف تتعلم منها.\n\n#تعلم_التداول #فوركس"}, {"day": 19, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nفي جلسة اليوم، نركز على كيفية إتقان مؤشر القوة النسبية (RSI). راقب كيف يتفاعل السوق مع هذا العن أ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 23, "type": "morning", "text": "☀️ صباح الخير لكل متداول يسعى للاحتراف 🌟\n\nهل فكرت يوماً في أبرز الأخطاء في استراتيجية السكالبينج؟ اليوم هو الوقت المناسب لدمج هذا المفهوم في خطة تداولك اليومية.\n\nكيف ترون اتجاه السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 23, "type": "evening", "text": "🌙 مساء الخير يا مجتمع Enter Point 🌟\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في استراتيجية السكالبينج قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nنلتقي غداً في يوم تداول جديد وفرص أفضل.\n\n#تعلم_التداول #فوركس"}, {"day": 24, "type": "morning", "text": "☀️ بداية يوم موفقة ومركزة نتمناها لكم 📈\n\nدرسنا اليوم يركز على أهمية الشموع اليابانية. لا تدع تحركات السوق العشوائية تشتتك عن هذا المبدأ الأساسي.\n\nدعونا نلتزم بخطتنا ولا ندع العواطف تسيطر.\n\n#EnterPoint_Academy #تداول"}, {"day": 24, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nاليوم ركزنا على أهمية الشموع اليابانية. المراجعة اليومية وتسجيل الملاحظات هي سر التطور في هذا المجال.\n\nشاركنا صفقتك الأفضل (أو الأسوأ) لليوم لنتعلم معاً.\n\n#تعلم_التداول #فوركس"}, {"day": 25, "type": "morning", "text": "☀️ صباحكم أرباح والتزام تام بالخطة 🎯\n\nنصيحة اليوم تدور حول كيفية إتقان التداول اليومي. تذكر دائماً أن الأسواق تكافئ المتداول المنضبط وتطرد العشوائي.\n\nدعونا نلتزم بخطتنا ولا ندع العواطف تسيطر.\n\n#EnterPoint_Academy #تداول"}, {"day": 25, "type": "evening", "text": "🌙 جلسة تداول انتهت، ودروس جديدة أضفناها لرصيدنا 💡\n\nمراجعة أداءنا في كيفية إتقان التداول اليومي اليوم ستجعلنا أقوى غداً. لا تستهن بقوة التقييم الذاتي.\n\nكيف تقيمون أداءكم ونفسيتكم اليوم من 10؟\n\n#تعلم_التداول #فوركس"}, {"day": 26, "type": "morning", "text": "☀️ استعدوا لافتتاح الأسواق المالية! ⏰\n\nسر النجاح اليوم يكمن في تطبيق أبرز الأخطاء في التنويع في الصفقات. التحضير المسبق هو ما يفصلك عن الخسارة.\n\nكيف ترون اتجاه السوق اليوم؟\n\n#EnterPoint_Academy #تداول"}, {"day": 26, "type": "evening", "text": "🌙 كيف كانت نتائجكم وتجربتكم اليوم؟ 📈\n\nخلاصة اليوم: التعامل مع أبرز الأخطاء ف  ندع العواطف تسيطر.\n\n#EnterPoint_Academy #تداول"}, {"day": 30, "type": "evening", "text": "🌙 حان وقت إغلاق الشاشات ومراجعة الصفقات 🔍\n\nنأمل أن يكون درس اليوم حول أبرز الأخطاء في نسبة العائد للمخاطرة (R:R) قد ساعدكم في تجنب الفخاخ الشائعة في السوق.\n\nتصبحون على خيارات أذكى وأرباح أكثر.\n\n#تعلم_التداول #فوركس"}];
        function generateDays() {
            const container = document.getElementById('postsContainer');
            const savedState = JSON.parse(localStorage.getItem('fb_posts_9_v2')) || {};
            const days = {};
            posts.forEach(p => { if(!days[p.day]) days[p.day] = {m:null, e:null}; if(p.type==='morning') days[p.day].m=p; else days[p.day].e=p; });
            
            Object.keys(days).sort((a,b)=>a-b).forEach(d => {
                const sec = document.createElement('div'); sec.className = 'day-section';
                sec.innerHTML = `<div class="day-header"><span>اليوم ${d}</span></div><div class="day-posts"></div>`;
                const postsDiv = sec.querySelector('.day-posts');
                [days[d].m, days[d].e].forEach((p, idx) => {
                    const i = (d-1)*2 + idx + 1;
                    const card = document.createElement('div'); card.className = 'post-card' + (savedState[`p-${i}`]?' published':'');
                    card.innerHTML = `<div class="post-published-container"><input type="checkbox" style="width:18px; height:18px; cursor:pointer;" onchange="toggle(this, ${i})" ${savedState[`p-${i}`]?'checked':''}></div>
                    <div><span class="post-time ${p.type}">${p.type==='morning'?'☀️ صباحاً':'🌙 مساءً'}</span></div>
                    <div class="post-text">${p.text.replace(/\n/g, '<br>')}</div>
                    <button class="copy-btn" onclick="copy(${i})">📋 نسخ النص</button><span class="copy-feedback" id="f-${i}">✓ تم النسخ بنجاح</span>`;
                    postsDiv.appendChild(card);
                });
                container.appendChild(sec);
            });
        }
        function toggle(cb, i) {
            cb.parentElement.parentElement.classList.toggle('published', cb.checked);
            const state = JSON.parse(localStorage.getItem('fb_posts_9_v2')) || {};
            state[`p-${i}`] = cb.checked;
            localStorage.setItem('fb_posts_9_v2', JSON.stringify(state));
        }
        function copy(i) {
            navigator.clipboard.writeText(posts[i-1].text).then(() => {
                const f = document.getElementById(`f-${i}`); f.classList.add('show');
                setTimeout(()=>f.classList.remove('show'), 2000);
            });
        }
        generateDays();
    </script>
