<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <title>منشورات X - Enter Point Trading Academy | أكتوبر 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); color: #fff; padding-top: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .navbar { background: #0f0f1e; border-bottom: 2px solid #d4af37; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; height: 70px; position: sticky; top: 0; z-index: 1000; margin: 0 -20px 30px -20px; }
        .navbar-right { display: flex; align-items: center; gap: 15px; }
        .navbar-logo-mark { width: 42px; height: 42px; border: 2px solid #d4af37; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #d4af37; font-size: 16px; background: rgba(212, 175, 55, 0.08); }
        .navbar-brand { display: flex; flex-direction: column; line-height: 1.2; }
        .navbar-brand .brand-main { font-size: 16px; font-weight: bold; color: #fff; }
        .navbar-brand .brand-main span { color: #d4af37; }
        .navbar-brand .brand-sub { font-size: 10px; color: #9e9e9e; }
        .navbar-center { display: flex; align-items: center; gap: 25px; }
        .nav-link { color: #fff; text-decoration: none; font-size: 13px; cursor: pointer; transition: color 0.2s; }
        .nav-link:hover, .nav-link.active { color: #d4af37; }
        .navbar-left { display: flex; align-items: center; gap: 10px; }
        .nav-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; color: #fff; font-size: 11px; cursor: pointer; }
        .nav-pill:hover { border-color: #d4af37; }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-box { background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%); border: 1px solid #d4af37; border-radius: 10px; padding: 15px 20px; flex: 1; min-width: 130px; }
        .stat-label { font-size: 11px; color: #9e9e9e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
        .stat-value { font-size: 24px; font-weight: 900; color: #d4af37; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .x-post { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border: 1px solid #d4af37; border-radius: 12px; padding: 16px; transition: all 0.3s ease; position: relative; }
        .x-post:hover { box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2); transform: translateY(-2px); }
        .x-post.published { opacity: 0.5; background: linear-gradient(135deg, #1a2e1a 0%, #1e3e1e 100%); border-color: #4cb50; }
        .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .post-number { font-size: 12px; font-weight: 700; color: #d4af37; }
        .post-checkbox { width: 18px; height: 18px; cursor: pointer; }
        .post-text { font-size: 14px; line-height: 1.6; color: #e0e0e0; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
        .post-tags { font-size: 11px; color: #00bcd4; margin-bottom: 12px; line-height: 1.4; }
        .post-footer { display: flex; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(212, 175, 55, 0.2); }
        .copy-btn { background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%); color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: transform 0.2s; font-family: 'Tajawal', sans-serif; flex: 1; }
        .copy-btn:hover { transform: scale(1.05); }
        .copy-feedback { font-size: 10px; color: #4cb50; opacity: 0; transition: opacity 0.3s; }
        .copy-feedback.show { opacity: 1; }
        @media (max-width: 768px) {
            .posts-grid { grid-template-columns: 1fr; }
            .navbar-center { display: none; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <div class="nav-pill">🌐 العربية</div>
        </div>
        <div class="navbar-center">
            <a class="nav-link active">منشورات X - أكتوبر</a>
            <a class="nav-link">التحليلات</a>
        </div>
        <div class="navbar-right">
            <div class="navbar-logo-mark">EP</div>
            <div class="navbar-brand">
                <span class="brand-main">Enter <span>Point</span></span>
                <span class="brand-sub">Trading Academy</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-box"><span class="stat-label">منشورات</span><span class="stat-value" id="totalPublished">0</span>/30</div>
            <div class="stat-box"><span class="stat-label">باقية</span><span class="stat-value" id="totalRemaining">30</span></div>
            <div class="stat-box"><span class="stat-label">نسبة</span><span class="stat-value" id="publishPercentage">0%</span></div>
        </div>

        <div class="posts-grid" id="postsContainer"></div>
    </div>

    <script>
        const posts = [
            { id: 1, text: 'أكتوبر = الآن.\n\nصفقات حقيقية.\nأموال حقيقية.\nنتائج حقيقية.\n\nالخوف طبيعي.\nلكن:\nابدأ.\n\n#RealTrading #EnterPoint' },
            { id: 2, text: 'أول صفقة = خطوة الأسد.\n\nمعظم الناس = لا يأخذونها.\nأنت؟\nخذها.\n\n#BeBrave #TakeThePlunge #EnterPoint' },
            { id: 3, text: 'السوق لا يهتم بمشاعرك.\nيهتم = بقرارك.\n\nخذ قرار محسوب.\nليس عاطفي.\n\n#MarketLogic #RationalDecisions #EnterPoint' },
            { id: 4, text: 'النظام = أساسك.\n\nبدون = فوضى.\nمع = نظام.\n\nطبق نظامك = في كل صفقة.\n\n#SystemFirst #Discipline #EnterPoint' },
            { id: 5, text: 'أول خسارة:\n= تعليم.\nليس = فشل.\n\nكل متاجر ناجح:\nبدأ بخسارة.\nتعلم.\nأصبح فائزاً.\n\n#Learning #Growth #EnterPoint' },
            { id: 6, text: 'جودة > كمية.\n\nصفقة واحدة محسوبة\n> 10 صفقات عشوائية.\n\nانتظر الصفقة المثالية.\n\n#Quality #Patience #EnterPoint' },
            { id: 7, text: 'خطر: الاستعجال.\n\nالمبتدئون = يتسرعون.\nالمحترفون = ينتظرون.\n\nكن محترفاً من الآن.\n\n#NoRush #Waiting #EnterPoint' },
            { id: 8, text: 'إدارة الخطر = الأهم.\n\nحماية رأس المال\n= أساس الربح.\n\nحافظ على أموالك أولاً.\n\n#RiskManagement #CapitalFirst #EnterPoint' },
            { id: 9, text: 'الخسارة الصغيرة = جيدة.\nالخسارة الكبيرة = سيئة.\n\nالفرق؟\nالانضباط.\n\n#SmartLosing #RiskControl #EnterPoint' },
            { id: 10, text: 'أسبوع واحد من التطبيق:\n\nشعورك = مختلف.\nثقتك = أقوى.\nخبرتك = تزداد.\n\nاستمر.\n\n#FirstWeek #KeepMomentum #EnterPoint' },
            { id: 11, text: 'كل صفقة = درس.\nكل ربح = تأكيد.\nكل خسارة = تعليم.\n\nشكر السوق.\n\n#EverySingleTrade #Learning #EnterPoint' },
            { id: 12, text: 'الفرق بين المحترف والهاوي:\n\nالهاوي = يتاجر.\nالمحترف = يفكر ثم يتاجر.\n\nفكر أولاً.\n\n#ThinkFirst #ProTrader #EnterPoint' },
            { id: 13, text: 'خطأ شائع: تغيير النظام بسرعة.\n\nأعطِ نظامك = 30 صفقة.\nثم = قيّم.\n\nلا تاقيم:\n= لا تتطور.\n\n#Consistency #DontGiveUp #EnterPoint' },
            { id: 14, text: 'حقيقة: الصبر = يربح.\n\nمن يصبر:\n= يربح.\nمن يستعجل:\n= يخسر.\n\nاختر الصبر.\n\n#PatientWins #Long #EnterPoint' },
            { id: 15, text: 'نص الشهر:\n\nإحصائية: كم صفقة؟ كم نتيجة؟\n\nالأرقام = تخبرك الحقيقة.\nلا تهرب منها.\n\n#DataDriven #FaceReality #EnterPoint' },
            { id: 16, text: 'كل ألم = درس.\nكل فشل = خطوة.\nكل سقطة = ارتفاعة.\n\nاحتضن الألم.\n\n#GrowthThroughPain #Resilience #EnterPoint' },
            { id: 17, text: 'سجل صفقاتك:\n✓ السبب\n✓ الدخول\n✓ الخروج\n✓ الدرس\n\nالتوثيق = يحسنك.\n\n#TradeJournal #Documentation #EnterPoint' },
            { id: 18, text: 'الثقة = تأتي من الممارسة.\n\nأول ثقة = من نظامك.\nثقة أكبر = من النتائج.\nثقة حقيقية = من الخبرة.\n\n#ConfidenceBuilding #Experience #EnterPoint' },
            { id: 19, text: 'السوق = عادل.\n\nتعطيه جهد\n= يعطيك نتائج.\n\nتهمله = يهملك.\n\n#UniversalJustice #YouReapWhatYouSow #EnterPoint' },
            { id: 20, text: 'الفارق:\nمن يقرأ النظرية\n≠\nمن يطبقها.\n\nأنت = الآن تطبق.\n= أنت مختلف.\n\n#ActionSpeaks #Implementation #EnterPoint' },
            { id: 21, text: 'أسبوعين من الآن:\n\nكم تطورت؟\nكم تعلمت؟\nكم تحسنت؟\n\nقيس تقدمك.\n\n#SelfMeasurement #Progress #EnterPoint' },
            { id: 22, text: 'خطر المبتدئين: الثقة الزائدة.\n\nبعد ربح واحد:\n= لا تتوقف عن الانضباط.\n\nالانضباط = دائماً.\n\n#OverConfidence #StayHumble #EnterPoint' },
            { id: 23, text: 'الحقيقة التي تؤلم:\n\nمعظم أول ربح = لا يدوم.\nلأن المبتدئ ينسى الآلية.\n\nلا تنسَ النظام.\n\n#StickToSystem #RememberRules #EnterPoint' },
            { id: 24, text: 'ستة أيام من انتهاء الشهر:\n\nآخر فرصة:\nلتثبيت ما تعلمته.\nللتطبيق الكامل.\n\nاستخدمها.\n\n#FinalDays #MakeItCount #EnterPoint' },
            { id: 25, text: 'حقيقة:\nأنت = الآن ليس مبتدئاً.\n\nأنت = متعلم متقدم.\nقريباً = محترف.\n\nاعترف بتطورك.\n\n#YouAreGrowing #Acknowledge #EnterPoint' },
            { id: 26, text: 'خمسة أيام:\nمتبقية من التطبيق الأول.\n\nثم:\nمرحلة الاحتراف.\n\nأنت = جاهز.\n\n#AlmostThere #ProfessionalPhase #EnterPoint' },
            { id: 27, text: 'الدرس الأهم:\n\nالنظام + الانضباط + الوقت\n= النجاح المضمون.\n\nأنت = تملك الثلاثة.\nالآن = طبق.\n\n#WinningFormula #Execute #EnterPoint' },
            { id: 28, text: 'أسبوع واحد:\nمن انتهاء التطبيق الأول.\n\nاستحضر:\n✓ الألم\n✓ الفرح\n✓ الدروس\n✓ النمو\n\n#Reflection #Gratitude #EnterPoint' },
            { id: 29, text: 'آخر يومين:\nمن أكتوبر.\n\nشهر انتهى.\nأنت = تطورت.\n\nنوفمبر:\n= مرحلة الاحتراف.\n\n#MonthComplete #LevelUp #EnterPoint' },
            { id: 30, text: 'أكتوبر = انتهى.\nأنت = لم تعد مبتدئاً.\n\nدخلت = خائفاً.\nخرجت = واثقاً.\n\nتحت؟ واصل.\nنوفمبر = لك.\n\n#Transformation #Onward #Victory #EnterPoint' }
        ];

        function generatePosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'x-post';
                card.id = `post-${post.id}`;

                card.innerHTML = `
                    <div class="post-header">
                        <span class="post-number">#${post.id}</span>
                        <input type="checkbox" class="post-checkbox" onchange="togglePublished(${post.id})">
                    </div>
                    <div class="post-text">${escapeHtml(post.text)}</div>
                    <div class="post-tags">#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji</div>
                    <div class="post-footer">
                        <button class="copy-btn" onclick="copyPost(${post.id})">📋 نسخ</button>
                        <span class="copy-feedback" id="feedback-${post.id}">✓ تم</span>
                    </div>
                `;

                container.appendChild(card);
            });

            updateStats();
        }

        function togglePublished(id) {
            const card = document.getElementById(`post-${id}`);
            const checkbox = card.querySelector('.post-checkbox');
            card.classList.toggle('published', checkbox.checked);
            updateStats();
        }

        function updateStats() {
            const allCheckboxes = document.querySelectorAll('.post-checkbox');
            const checkedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
            const totalCount = allCheckboxes.length;
            const remainingCount = totalCount - checkedCount;
            const percentage = Math.round((checkedCount / totalCount) * 100);

            document.getElementById('totalPublished').textContent = checkedCount;
            document.getElementById('totalRemaining').textContent = remainingCount;
            document.getElementById('publishPercentage').textContent = percentage + '%';
        }

        function copyPost(id) {
            const post = posts.find(p => p.id === id);
            const fullText = `${post.text}\n\n#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji\n\nhttps://www.enterpoint.online/`;
            
            navigator.clipboard.writeText(fullText).then(() => {
                const feedback = document.getElementById(`feedback-${id}`);
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('خطأ في النسخ');
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        generatePosts();
    </script>
</body>
</html>
