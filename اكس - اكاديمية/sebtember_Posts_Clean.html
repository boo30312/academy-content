    <title>منشورات X - Enter Point Trading Academy | سبتمبر 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #0f0f0f; color: #fff; padding-top: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar { background: #0f0f1e; border-bottom: 2px solid #d4af37; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; height: 70px; position: sticky; top: 0; z-index: 1000; }
        .navbar-logo-mark { width: 42px; height: 42px; border: 2px solid #d4af37; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #d4af37; background: rgba(212, 175, 55, 0.08); }
        .news-ticker { background: #1a2d5a; border: 2px solid #d4af37; border-radius: 12px; padding: 12px 20px; margin-bottom: 30px; overflow: hidden; position: relative; }
        .day-section { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 15px; padding: 20px; margin-bottom: 30px; }
        .day-header { background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%); color: #000; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; display: flex; justify-content: space-between; }
        .day-posts { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .post-card { background: #1a2d5a; border-left: 4px solid #d4af37; border-radius: 10px; padding: 18px; position: relative; padding-top: 35px; }
        .post-card.published { border-left-color: #4ade80; opacity: 0.85; }
        .post-published-container { position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 6px; }
        .post-time { background: #d4af37; color: #000; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .post-time.morning { background: #ffd89b; }
        .post-time.evening { background: #7b68ee; color: #fff; }
        .post-text { color: #e0e0e0; line-height: 1.7; margin-bottom: 12px; font-size: 13px; white-space: pre-wrap; }
        .copy-btn { background: #d4af37; color: #000; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .copy-feedback { color: #4ade80; font-size: 11px; margin-left: 8px; display: none; }
        .copy-feedback.show { display: inline; }
        @media (max-width: 768px) { .day-posts { grid-template-columns: 1fr; } }
    </style>

<body>
    <div class="navbar">
        <div class="navbar-logo-mark">EP</div>
        <div style="font-weight: bold; font-size: 18px;">Enter Point <span style="color:#d4af37">Academy</span></div>
    </div>
    <div class="container">
        <div class="news-ticker"><div style="color:#fff;">منشورات شهر سبتمبر (9) - 60 منشور جاهز للنشر</div></div>
        <div id="postsContainer"></div>
    </div>
    <script>
        const posts = [{"day": 1, "type": "morning", "text": "أهلاً سبتمبر! شهر 'العودة للعمل' الحقيقية في الأسواق المالية. انتهت إجازات الصيف، والسيولة بدأت تعود لمستوياتها الطبيعية. استعد لتقلبات أكبر.\n\n#EnterPoint_Academy #SeptemberTrading #MarketVolatility"}, {"day": 1, "type": "evening", "text": "لا تحاول تعويض خسائر الصيف في يوم واحد. سبتمبر شهر يحتاج انضباطاً عالياً لأن حركة السوق تصبح أسرع. التزم بخطتك فقط.\n\n#TradingDiscipline #EnterPoint_Academy #Forex"}, {"day": 2, "type": "morning", "text": "قبل أن تبدأ التداول اليوم، اسأل نفسك: هل أنا في حالة نفسية تسمح لي باتخاذ قرارات عقلانية؟ الصحة النفسية هي رأس مال المتداول الحقيقي.\n\n#TradingPsychology #EnterPoint_Academy #MentalHealth"}, {"day": 2, "type": "evening", "text": "الإعداد قبل افتتاح السوق أهم من التحليل أثناء الجلسة. خصص 30 دقيقة صباحاً لتحديد مستويات الدعم والمقاومة. لا تتداول عشوائياً.\n\n#MarketPreparation #EnterPoint_Academy #TradingTips"}, {"day": 3, "type": "morning", "text": "لا تجعل الرافعة المالية تخدعك. هي أداة قوية لكنها سيف ذو حدين. المحترف يستخدمها لتعزيز الأرباح، والمبتدئ يستخدمها لمضاعفة الخسائر.\n\n#Leverage #EnterPoint_Academy #RiskManagement"}, {"day": 3, "type": "evening", "text": "السوق يختبر صبرك كل يوم. الأموال تنتقل دائماً من أيدي المتعجلين إلى أيدي الصابرين. في أي جانب تقف أنت؟\n\n#TradingPatience #EnterPoint_Academy #MarketReality"}, {"day": 4, "type": "morning", "text": "إذا شعرت أنك لا تفهم ما يحدث في السوق، فأفضل 'صفقة' يمكنك القيام بها هي عدم التداول. حماية رأس المال هي نصف الربح.\n\n#CapitalPreservation #EnterPoint_Academy #TradeSmart"}, {"day": 4, "type": "evening", "text": "الخسارة جزء لا يتجزأ من التداول. المحترف لا يغضب من الخسارة، بل يراجع أسبابها لضمان عدم تكرار نفس الخطأ غداً.\n\n#TradingMindset #EnterPoint_Academy #LearnFromMistakes"}, {"day": 5, "type": "morning", "text": "التحليل الفني هو قراءة للماضي لمحاولة فهم المستقبل. لا تعتمد عليه بنسبة 100%، بل دعه يكون بوصلتك وسط أمواج السيولة.\n\n#TechnicalAnalysis #EnterPoint_Academy #PriceAction"}, {"day": 5, "type": "evening", "text": "نهاية أسبوع عمل في سبتمبر. أسبوع حافل بالفرص والمخاطر. استمتع بعطلتك، أغلق المنصة، وابتعد عن الشارت لتصفية ذهنك.\n\n#WeekendVibes #EnterPoint_Academy #TraderLife"}, {"day": 6, "type": "morning", "text": "التداول ليس سباقاً للثراء السريع. هو عمل احترافي يتطلب سنوات من التعلم والتطوير. ابدأ صغيراً لتكبر بهدوء وبأمان.\n\n#TradingJourney #EnterPoint_Academy #SlowAndSteady"}, {"day": 6, "type": "evening", "text": "لا تضف أبداً إلى صفقة خاسرة. التبريد هو وصفة سريعة لإنهاء مسيرتك في التداول. تقبل الخطأ واخرج بكرامة.\n\n#RiskControl #EnterPoint_Academy #TradingRules"}, {"day": 7, "type": "morning", "text": "التركيز على زوج عملات واحد أو أصلين ماليين وإتقان حركتهم أفضل من تشتيت انتباهك بين 10 أزواج. التخصص يصنع الاحتراف.\n\n#Focus #EnterPoint_Academy #TradingStrategy"}, {"day": 7, "type": "evening", "text": "الغرور بعد سلسلة صفقات رابحة هو عدوك الأول. ابق متواضعاً، السوق لا يرحم من يظن أنه هزمه.\n\n#StayHumble #EnterPoint_Academy #MarketWisdom"}, {"day": 8, "type": "morning", "text": "لا تتبع الآخرين في قرارات دخولك وخروجك. تعلم كيف تعتمد على تحليلك الخاص، ففي النهاية، أنت من يتحمل مسؤولية رأس مالك.\n\n#IndependentTrading #EnterPoint_Academy #TraderConfidence"}, {"day": 8, "type": "evening", "text": "هل سجلت سبب دخول كل صفقة اليوم؟ إذا لم تكن تفعل، فأنت لا تتداول، أنت تقامر. سجل كل شيء في يومياتك.\n\n#TradingJournal #EnterPoint_Academy #DataDriven"}, {"day": 9, "type": "morning", "text": "التقويم الاقتصادي هو خارطة طريقك. لا تتداول وقت صدور الأخبار الكبيرة إلا إذا كان لديك استراتيجية خاصة للتعامل معها.\n\n#NewsTrading #EnterPoint_Academy #EconomicCalendar"}, {"day": 9, "type": "evening", "text": "الأسواق المالية لا تكترث بآرائك الشخصية. هي تتحرك بناءً على قوى العرض والطلب. كن مرناً وواكب حركة السوق.\n\n#Adaptability #EnterPoint_Academy #PriceActionTrader"}, {"day": 10, "type": "morning", "text": "استخدم وقف الخسارة (Stop Loss) كحزام أمان لسيارتك. قد لا تحتاجه في كل رحلة، لكنك لن تنطلق بدونه أبداً.\n\n#StopLoss #EnterPoint_Academy #SafetyFirst"}, {"day": 10, "type": "evening", "text": "الوصول لمنتصف الشهر يعني أن وقت مراجعة الأداء قد حان. ما الذي نجح في النصف الأول وما الذي يجب تغييره للنصف الثاني؟\n\n#MidMonthReview #EnterPoint_Academy #ContinuousImprovement"}, {"day": 11, "type": "morning", "text": "لا تبحث عن الكأس المقدسة في المؤشرات الفنية. السعر ومستويات العرض والطلب هم الحقيقة الوحيدة في السوق.\n\n#NakedChart #EnterPoint_Academy #TradingTips"}, {"day": 11, "type": "evening", "text": "إدارة المخاطر ليست اختياراً، بل هي أساس بقائك في السوق. خاطر بـ 1-2% فقط من حسابك في كل صفقة.\n\n#MoneyManagement #EnterPoint_Academy #RiskFirst"}, {"day": 12, "type": "morning", "text": "التداول مع الاتجاه (Trend Following) غالباً ما يكون الطريق الأسهل للربح. لا تسبح ضد التيار، انتظر الموجة واركبها.\n\n#TrendTrading #EnterPoint_Academy #ForexTips"}, {"day": 12, "type": "evening", "text": "أغلق شاشاتك مبكراً إذا كنت تشعر بالتعب أو التوتر. السوق سيكون هنا غداً، لكن رأس مالك قد لا يعود إذا تداولت وأنت غير مستعد.\n\n#EmotionalControl #EnterPoint_Academy #MentalHealthMatters"}, {"day": 13, "type": "morning", "text": "المتداول الناجح هو الذي يتقبل الخسارة بهدوء، يحللها، ثم ينتقل للصفقة التالية دون تردد. الخوف من الخسارة يعطل أرباحك.\n\n#FearOfLoss #EnterPoint_Academy #TraderPsychology"}, {"day": 13, "type": "evening", "text": "الأيام الهادئة في السوق هي فرصتك الذهبية للتعلم واختبار استراتيجيات جديدة. لا تمل، استغل وقتك في التطوير.\n\n#ContinuousLearning #EnterPoint_Academy #Backtesting"}, {"day": 14, "type": "morning", "text": "تذكر أن 'عدم التداول' بحد ذاته هو استراتيجية قوية. عندما لا تتوفر فرص حقيقية، فإن حفظ رأس مالك هو أعظم ربح.\n\n#PatienceIsProfit #EnterPoint_Academy #TradeSmart"}, {"day": 14, "type": "evening", "text": "لقد أوشك سبتمبر على الانتهاء. راجع أهدافك الشهرية، هل حققت ما كنت تطمح إليه؟ التقييم هو مفتاح التطور.\n\n#SeptemberReview #EnterPoint_Academy #GoalSetting"}, {"day": 15, "type": "morning", "text": "السوق يمر بمراحل: اتجاه قوي، تصحيح، تذبذب. مهمتك هي معرفة المرحلة الحالية وتكييف أسلوبك معها.\n\n#MarketCycles #EnterPoint_Academy #Analysis"}, {"day": 15, "type": "evening", "text": "راجع سجل صفقاتك قبل النوم. اكتشف الأنماط المتكررة في صفقاتك الرابحة والخاسرة. البيانات لا تكذب.\n\n#TradingAnalysis #EnterPoint_Academy #TraderGrowth"}, {"day": 16, "type": "morning", "text": "لا تستمع لنصائح التداول من غير المختصين. اتبع خبيراً، تعلم أساسيات قوية، وابنِ طريقك الخاص.\n\n#TradingEducation #EnterPoint_Academy #LearnFromExperts"}, {"day": 16, "type": "evening", "text": "الالتزام بالقواعد يجعلك مملاً، لكنه يجعلك مربحاً على المدى الطويل. المتعة في التداول تأتي من الأرباح لا من المخاطرة غير المحسوبة.\n\n#RulesBasedTrading #EnterPoint_Academy #Discipline"}, {"day": 17, "type": "morning", "text": "الشجاعة في التداول تعني القدرة على إغلاق الصفقة الخاسرة فوراً، وليس التمسك بها أملاً في عودة السعر.\n\n#Courage #EnterPoint_Academy #StopLossImportance"}, {"day": 17, "type": "evening", "text": "كل يوم هو صفحة جديدة. لا تسمح لخطأ الأمس بأن يؤثر على قراراتك اليوم. ابدأ بذهن صافٍ دائماً.\n\n#FreshStart #EnterPoint_Academy #TradingMindset"}, {"day": 18, "type": "morning", "text": "استخدم الأطر الزمنية المتعددة (Multi-Timeframe) للحصول على نظرة شاملة. لا تكتفِ بفريم واحد، انظر للصورة الكبيرة.\n\n#MultiTimeframe #EnterPoint_Academy #TechnicalAnalysis"}, {"day": 18, "type": "evening", "text": "الاحتراف يتطلب وقتاً وتكراراً. لا تتوقع أن تصبح متداولاً ناجحاً في شهر أو شهرين. استمر في العمل.\n\n#Consistency #EnterPoint_Academy #TradingJourney"}, {"day": 19, "type": "morning", "text": "السوق ليس مكاناً للبحث عن الإثارة. إذا كنت تبحث عن الإثارة، فالسوق سيجعلك تدفع ثمنها من حسابك.\n\n#TradingReality #EnterPoint_Academy #SeriousBusiness"}, {"day": 19, "type": "evening", "text": "قبل إغلاق السوق في عطلة نهاية الأسبوع، تأكد من أنك لست تحت ضغط أي صفقة مفتوحة. راحة البال أهم من أي صفقة.\n\n#WeekendTrading #EnterPoint_Academy #RiskControl"}, {"day": 20, "type": "morning", "text": "البساطة هي سر النجاح. لا تملأ الشارت الخاص بك بمؤشرات كثيرة تسبب لك (شلل التحليل). اجعل تحليلك بسيطاً وواضحاً.\n\n#KeepItSimple #EnterPoint_Academy #CleanCharts"}, {"day": 20, "type": "evening", "text": "راجع أداءك لهذا الأسبوع. ما الذي كان جيداً؟ وما الذي كان سيئاً؟ التعلم المستمر هو الفرق بين المحترف والهاوي.\n\n#WeeklyReview #EnterPoint_Academy #Improvement"}, {"day": 21, "type": "morning", "text": "الثقة تأتي من الالتزام بالاستراتيجية، وليس من توقع نتائج الصفقة. إذا التزمت بالعملية، فالنتائج ستأتي.\n\n#TrustTheProcess #EnterPoint_Academy #TradingPlan"}, {"day": 21, "type": "evening", "text": "هل لديك خطة لكل سيناريو ممكن؟ ماذا ستفعل إذا صعد السعر؟ ماذا ستفعل إذا هبط؟ التخطيط المسبق يقلل من توترك.\n\n#TradingPlan #EnterPoint_Academy #Scenarios"}, {"day": 22, "type": "morning", "text": "النجاح في التداول لا يقاس بعدد الصفقات الرابحة، بل بجودة القرارات التي تتخذها باستمرار.\n\n#QualityTrading #EnterPoint_Academy #SuccessMindset"}, {"day": 22, "type": "evening", "text": "لا تقارن نتائجك بنتائج الآخرين على تويتر. أنت لا تعرف ظروفهم ولا حجم مخاطرتهم. ركز على حسابك فقط.\n\n#FocusOnYou #EnterPoint_Academy #ComparisonIsTheThiefOfJoy"}, {"day": 23, "type": "morning", "text": "العمل الجاد في التداول يعني الدراسة، التحليل، ومراجعة الذات. ليس بالضرورة قضاء 12 ساعة أمام الشاشات.\n\n#HardWork #EnterPoint_Academy #Productivity"}, {"day": 23, "type": "evening", "text": "كل صفقة هي درس. حتى الصفقات الرابحة تعلمك شيئاً. كن تلميذاً دائماً للسوق.\n\n#TradingLesson #EnterPoint_Academy #LifeLongLearner"}, {"day": 24, "type": "morning", "text": "إدارة رأس المال هي القلعة التي تحميك من الانهيار. مهما كانت استراتيجيتك قوية، بدون إدارة مالية، أنت عرضة للخسارة.\n\n#RiskManagementMastery #EnterPoint_Academy #TradingSafety"}, {"day": 24, "type": "evening", "text": "هل قمت اليوم بمراجعة تقويمك الاقتصادي؟ الأخبار يمكن أن تدمر أسبوعاً من التحليل التقني في دقيقة.\n\n#EconomicNews #EnterPoint_Academy #MarketAwareness"}, {"day": 25, "type": "morning", "text": "التداول يغير شخصيتك. يعلمك الصبر، الانضباط، والمسؤولية. استمتع برحلة التحول هذه.\n\n#PersonalGrowth #EnterPoint_Academy #TradingLife"}, {"day": 25, "type": "evening", "text": "الاستمرارية هي مفتاح النجاح. التداول لسنوات هو المقياس الحقيقي للاحتراف، وليس ربح شهر واحد.\n\n#ConsistencyIsKey #EnterPoint_Academy #LongTermSuccess"}, {"day": 26, "type": "morning", "text": "لا تتداول أبداً أموالاً لا تستطيع تحمل خسارتها. هذا الضغط سيؤدي بك لاتخاذ أسوأ القرارات.\n\n#FinancialResponsibility #EnterPoint_Academy #TradingWisdom"}, {"day": 26, "type": "evening", "text": "نهاية شهر سبتمبر! أغلق حساباتك، احسب أرباحك وخسائرك، وضع أهدافاً جديدة لشهر أكتوبر. نحن مستمرون في رحلة التعلم.\n\n#MonthEnd #EnterPoint_Academy #NewGoals"}, {"day": 27, "type": "morning", "text": "الشهر الجديد على الأبواب. هل أنت جاهز؟ التداول هو تحضير مستمر، استعد لفرص أكتوبر.\n\n#NewMonth #EnterPoint_Academy #Preparation"}, {"day": 27, "type": "evening", "text": "كل يوم في السوق هو فرصة لتعلم شيء جديد. كن منفتحاً على السوق، كن ذكياً، وكن منضبطاً.\n\n#TradingOpportunity #EnterPoint_Academy #NextSteps"}, {"day": 28, "type": "morning", "text": "النجاح لا يأتي بالصدفة. يأتي بالخطط، التنفيذ، المراجعة، والتطوير المستمر.\n\n#SuccessPath #EnterPoint_Academy #TradingExcellence"}, {"day": 28, "type": "evening", "text": "ليلة سعيدة لكل المتداولين. السوق يحتاج لعقلٍ هادئ وجسم مرتاح. استعدوا ليوم تداول جديد بذكاء.\n\n#GoodNight #EnterPoint_Academy #TradingCommunity"}, {"day": 29, "type": "morning", "text": "شكراً لكونكم جزءاً من مجتمع Enter Point Academy. معاً نتعلم، معاً نتطور، ومعاً نحقق أهدافنا في الأسواق المالية.\n\n#EnterPoint_Academy #TradingCommunity #SuccessTogether"}, {"day": 29, "type": "evening", "text": "آخر منشور في سبتمبر. تذكر دائماً أن التداول ماراثون وليس سباق سرعة. استمر، تعلم، وتطور. نراكم في أكتوبر!\n\n#EndOfTheMonth #EnterPoint_Academy #OctoberPreparation"}];
        function generateDays() {
            const container = document.getElementById('postsContainer');
            const savedState = JSON.parse(localStorage.getItem('x_posts_state_september')) || {};
            const days = {};
            posts.forEach(p => { if(!days[p.day]) days[p.day] = {m:null, e:null}; if(p.type==='morning') days[p.day].m=p; else days[p.day].e=p; });
            
            Object.keys(days).sort((a,b)=>a-b).forEach(d => {
                const sec = document.createElement('div'); sec.className = 'day-section';
                sec.innerHTML = `<div class="day-header"><span>اليوم ${d}</span></div><div class="day-posts"></div>`;
                const postsDiv = sec.querySelector('.day-posts');
                [days[d].m, days[d].e].forEach((p, idx) => {
                    const i = (d-1)*2 + idx + 1;
                    const card = document.createElement('div'); card.className = 'post-card' + (savedState[`p-${i}`]?' published':'');
                    card.innerHTML = `<div class="post-published-container"><input type="checkbox" onchange="toggle(this, ${i})" ${savedState[`p-${i}`]?'checked':''}></div>
                    <div class="post-header"><span class="post-time ${p.type}">${p.type==='morning'?'☀️ صباحاً':'🌙 مساءً'}</span></div>
                    <div class="post-text">${p.text.replace(/\n/g, '<br>')}</div>
                    <button class="copy-btn" onclick="copy(${i})">📋 نسخ النص</button><span class="copy-feedback" id="f-${i}">✓ تم النسخ</span>`;
                    postsDiv.appendChild(card);
                });
                container.appendChild(sec);
            });
        }
        function toggle(cb, i) {
            cb.parentElement.parentElement.classList.toggle('published', cb.checked);
            const state = JSON.parse(localStorage.getItem('x_posts_state_september')) || {};
            state[`p-${i}`] = cb.checked;
            localStorage.setItem('x_posts_state_september', JSON.stringify(state));
        }
        function copy(i) {
            navigator.clipboard.writeText(posts[i-1].text).then(() => {
                const f = document.getElementById(`f-${i}`); f.classList.add('show');
                setTimeout(()=>f.classList.remove('show'), 2000);
            });
        }
        generateDays();
