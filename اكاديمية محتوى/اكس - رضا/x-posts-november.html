<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <title>منشورات X - Enter Point Trading Academy | نوفمبر 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); color: #fff; padding-top: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .navbar { background: #0f0f1e; border-bottom: 2px solid #d4af37; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; height: 70px; position: sticky; top: 0; z-index: 1000; margin: 0 -20px 30px -20px; }
        .navbar-right { display: flex; align-items: center; gap: 15px; }
        .navbar-logo-mark { width: 42px; height: 42px; border: 2px solid #d4af37; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #d4af37; font-size: 16px; background: rgba(212, 175, 55, 0.08); }
        .navbar-brand { display: flex; flex-direction: column; line-height: 1.2; }
        .navbar-brand .brand-main { font-size: 16px; font-weight: bold; color: #fff; }
        .navbar-brand .brand-main span { color: #d4af37; }
        .navbar-brand .brand-sub { font-size: 10px; color: #9e9e9e; }
        .navbar-center { display: flex; align-items: center; gap: 25px; }
        .nav-link { color: #fff; text-decoration: none; font-size: 13px; cursor: pointer; transition: color 0.2s; }
        .nav-link:hover, .nav-link.active { color: #d4af37; }
        .navbar-left { display: flex; align-items: center; gap: 10px; }
        .nav-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; color: #fff; font-size: 11px; cursor: pointer; }
        .nav-pill:hover { border-color: #d4af37; }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-box { background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%); border: 1px solid #d4af37; border-radius: 10px; padding: 15px 20px; flex: 1; min-width: 130px; }
        .stat-label { font-size: 11px; color: #9e9e9e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
        .stat-value { font-size: 24px; font-weight: 900; color: #d4af37; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .x-post { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border: 1px solid #d4af37; border-radius: 12px; padding: 16px; transition: all 0.3s ease; position: relative; }
        .x-post:hover { box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2); transform: translateY(-2px); }
        .x-post.published { opacity: 0.5; background: linear-gradient(135deg, #1a2e1a 0%, #1e3e1e 100%); border-color: #4cb50; }
        .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .post-number { font-size: 12px; font-weight: 700; color: #d4af37; }
        .post-checkbox { width: 18px; height: 18px; cursor: pointer; }
        .post-text { font-size: 14px; line-height: 1.6; color: #e0e0e0; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
        .post-tags { font-size: 11px; color: #00bcd4; margin-bottom: 12px; line-height: 1.4; }
        .post-footer { display: flex; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(212, 175, 55, 0.2); }
        .copy-btn { background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%); color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: transform 0.2s; font-family: 'Tajawal', sans-serif; flex: 1; }
        .copy-btn:hover { transform: scale(1.05); }
        .copy-feedback { font-size: 10px; color: #4cb50; opacity: 0; transition: opacity 0.3s; }
        .copy-feedback.show { opacity: 1; }
        @media (max-width: 768px) {
            .posts-grid { grid-template-columns: 1fr; }
            .navbar-center { display: none; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <div class="nav-pill">🌐 العربية</div>
        </div>
        <div class="navbar-center">
            <a class="nav-link active">منشورات X - نوفمبر</a>
            <a class="nav-link">التحليلات</a>
        </div>
        <div class="navbar-right">
            <div class="navbar-logo-mark">EP</div>
            <div class="navbar-brand">
                <span class="brand-main">Enter <span>Point</span></span>
                <span class="brand-sub">Trading Academy</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-box"><span class="stat-label">منشورات</span><span class="stat-value" id="totalPublished">0</span>/30</div>
            <div class="stat-box"><span class="stat-label">باقية</span><span class="stat-value" id="totalRemaining">30</span></div>
            <div class="stat-box"><span class="stat-label">نسبة</span><span class="stat-value" id="publishPercentage">0%</span></div>
        </div>

        <div class="posts-grid" id="postsContainer"></div>
    </div>

    <script>
        const posts = [
            { id: 1, text: 'نوفمبر = شهر الاحتراف.\n\nليس مبتدئ.\n= محترف.\n\nتوقعات أعلى.\nمعايير أعلى.\nنتائج أعلى.\n\n#Professional #EnterPoint' },
            { id: 2, text: 'المحترف = ينضبط دائماً.\n\nليس عندما يربح.\n= دائماً.\n\nالانضباط = لا يتوقف.\n\n#Discipline #AlwaysMatter #EnterPoint' },
            { id: 3, text: 'حماية رأس المال:\n= أساس الاحتراف.\n\nمن يحمي = يستمر.\nمن يخاطر = يتوقف.\n\n#CapitalFirst #Protection #EnterPoint' },
            { id: 4, text: 'المحترف يقول:\n\"من الذي أخطأ؟ أنا أم السوق؟\"\n\nليس:\n\"ليش خسرت؟\"\n\n#ProThinking #Accountability #EnterPoint' },
            { id: 5, text: 'الثقة بالنظام:\n= أساس الثقة بنفسك.\n\nثق بنظامك أولاً.\nستثق بنفسك لاحقاً.\n\n#TrustSystem #TrustYourself #EnterPoint' },
            { id: 6, text: 'الفرق بين الهاوي والمحترف:\n\nالهاوي = يريد ربح كبير.\nالمحترف = يريد ربح ثابت.\n\nاختر الثبات.\n\n#ConsistentGains #Stability #EnterPoint' },
            { id: 7, text: '1% يومي ثابت:\n> 50% في يوم و -40% في يوم.\n\nالاستقرار = ملك.\n\n#Stability #ConsistentReturns #EnterPoint' },
            { id: 8, text: 'المحترف = صامت.\n\nلا يتحدث عن أرباحه.\nلا يفتخر بنجاحه.\n= يترك أرباحه تتحدث.\n\n#QuietConfidence #LetTheResultsSpeak #EnterPoint' },
            { id: 9, text: 'إدارة الخسائر:\n= أهم من تحقيق الأرباح.\n\nمن يدير الخسائر:\n= يدير الأرباح.\n\n#LossManagement #RiskControl #EnterPoint' },
            { id: 10, text: 'أسبوع من الاحتراف:\n\nشعورك:\n= مختلف\n= أهدأ\n= أقوى\n\nهذا = الاحتراف.\n\n#Professionalism #MentalPeace #EnterPoint' },
            { id: 11, text: 'حقيقة: المحترف يفهم:\nالفوز والخسارة = متساويان.\n\nالاثنان = درسان.\nالاثنان = يأخذانه للأمام.\n\n#WinOrLearn #BothAreGood #EnterPoint' },
            { id: 12, text: 'الخسارة الذكية:\nصفقة صغيرة الخسارة.\n\nالخسارة الغبية:\nصفقة كبيرة الخسارة.\n\nكن ذكياً.\n\n#SmartLosing #ManageRisk #EnterPoint' },
            { id: 13, text: 'سجل كل شيء:\n✓ الصفقات\n✓ الأسباب\n✓ النتائج\n✓ الدروس\n\nالتسجيل = يحسنك.\n\n#TradeJournal #Documentation #EnterPoint' },
            { id: 14, text: 'نص الشهر:\n\nأنت = محترف حقيقي الآن.\nليس مزعوم.\n= حقيقي.\n\nاعترف بهذا.\n\n#YouAreAPro #RealProfessional #EnterPoint' },
            { id: 15, text: 'حقيقة عميقة:\nالمحترف = لا ينتصر دائماً.\nبل = يخسر بذكاء.\n\nالخسارة الذكية\n≠\nالخسارة الحمقاء.\n\n#SmartLosing #Wisdom #EnterPoint' },
            { id: 16, text: 'أخطاء المحترفين نادرة:\n\nلأنهم:\n✓ يفكرون قبل الدخول\n✓ يطبقون النظام\n✓ يقبلون النتائج\n\n#MistakeFree #Professional #EnterPoint' },
            { id: 17, text: 'المحترف يسأل نفسه يومياً:\n\"هل أنا أفضل من أمس؟\"\n\nإذا لا = يغير.\nإذا نعم = يستمر.\n\n#DailyImprovement #SelfCheck #EnterPoint' },
            { id: 18, text: 'حقيقة عن الاحتراف:\nليس عن الكمال.\n= عن الاتساق.\n\nاتساق = أفضل من الكمال.\n\n#Consistency #BetterThanPerfection #EnterPoint' },
            { id: 19, text: 'المحترف = هادئ عند الخسارة.\n\nلماذا؟\nلأنه يعرف:\nهذا ثمن التجارة.\nهذا درس.\nغداً = فرصة جديدة.\n\n#CalmUnderPressure #Resilience #EnterPoint' },
            { id: 20, text: 'الفرق في الاحتراف:\nليس في الأرقام.\n= في العقلية.\n\nعقليتك = تحدد مستقبلك.\n\n#Mindset #MentalGame #EnterPoint' },
            { id: 21, text: 'أسبوعين من الاحتراف:\n\nالفرق واضح:\n✓ أهدأ\n✓ أذكى\n✓ أقوى\n✓ أكثر ثقة\n\n#NoticeableDifference #Transformation #EnterPoint' },
            { id: 22, text: 'المحترف = يعرف:\nمتى يدخل.\nمتى يطلع.\nمتى ينتظر.\n\nهذه = المهارة.\n\n#ProfessionalSkills #Mastery #EnterPoint' },
            { id: 23, text: 'حقيقة: الثقة = ليست غرور.\n\nالثقة = استيقان بنظامك.\nالغرور = وهم بقدرتك.\n\nكن واثقاً.\n\n#ConfidenceVsArrogance #Balance #EnterPoint' },
            { id: 24, text: 'ستة أيام من نهاية الشهر:\n\nآخر فرصة:\nلتصقيل احترافيتك.\n\nاستخدمها.\n\n#FinalDays #Polish #EnterPoint' },
            { id: 25, text: 'حقيقة:\nالاحتراف = ليس نهاية.\n= هو بداية.\n\nبداية:\n✓ ربح مستقر\n✓ نمو مستمر\n✓ احتراف حقيقي\n\n#JustTheBeginning #LongJourney #EnterPoint' },
            { id: 26, text: 'خمسة أيام:\nمتبقية من الاحتراف الأول.\n\nثم:\nديسمبر = الحصاد.\n\nأنت = جاهز.\n\n#AlmostThere #HarvestAwaits #EnterPoint' },
            { id: 27, text: 'المحترف = شاكر.\n\nشاكر لـ:\n✓ الصفقات\n✓ الدروس\n✓ النمو\n✓ الفرص\n\n#Gratitude #GratefulTrader #EnterPoint' },
            { id: 28, text: 'أسبوع واحد:\nمن انتهاء الاحتراف الأول.\n\nاستحضر:\nكل درس.\nكل نمو.\nكل تحسن.\n\n#Reflection #Appreciation #EnterPoint' },
            { id: 29, text: 'آخر يومين:\nمن نوفمبر.\n\nشهر انتهى.\nأنت = محترف حقيقي الآن.\n\nديسمبر:\n= الحصاد ينتظرك.\n\n#MonthComplete #ProfessionalTrader #EnterPoint' },
            { id: 30, text: 'نوفمبر = انتهى.\nأنت = احترفت.\n\nدخلت = متعلماً.\nخرجت = محترفاً.\n\nالطريق:\nعليّ.\nالمستقبل:\nمشرق.\n\nديسمبر = لك.\n\n#ProfessionalTrader #Victory #HarvestIncoming #EnterPoint' }
        ];

        function generatePosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'x-post';
                card.id = `post-${post.id}`;

                card.innerHTML = `
                    <div class="post-header">
                        <span class="post-number">#${post.id}</span>
                        <input type="checkbox" class="post-checkbox" onchange="togglePublished(${post.id})">
                    </div>
                    <div class="post-text">${escapeHtml(post.text)}</div>
                    <div class="post-tags">#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji</div>
                    <div class="post-footer">
                        <button class="copy-btn" onclick="copyPost(${post.id})">📋 نسخ</button>
                        <span class="copy-feedback" id="feedback-${post.id}">✓ تم</span>
                    </div>
                `;

                container.appendChild(card);
            });

            updateStats();
        }

        function togglePublished(id) {
            const card = document.getElementById(`post-${id}`);
            const checkbox = card.querySelector('.post-checkbox');
            card.classList.toggle('published', checkbox.checked);
            updateStats();
        }

        function updateStats() {
            const allCheckboxes = document.querySelectorAll('.post-checkbox');
            const checkedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
            const totalCount = allCheckboxes.length;
            const remainingCount = totalCount - checkedCount;
            const percentage = Math.round((checkedCount / totalCount) * 100);

            document.getElementById('totalPublished').textContent = checkedCount;
            document.getElementById('totalRemaining').textContent = remainingCount;
            document.getElementById('publishPercentage').textContent = percentage + '%';
        }

        function copyPost(id) {
            const post = posts.find(p => p.id === id);
            const fullText = `${post.text}\n\n#Trading #Forex #Psychology #EnterPoint #TradingAcademy #RezaAlhajji\n\nhttps://www.enterpoint.online/`;
            
            navigator.clipboard.writeText(fullText).then(() => {
                const feedback = document.getElementById(`feedback-${id}`);
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('خطأ في النسخ');
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        generatePosts();
    </script>
</body>
</html>
