    <div class="page-title-banner">

    <script>
        // مصفوفة تحتوي على 50 نصاً مختلفاً ومستقلاً تماماً (بدون تكرار نهائياً)
        const articlesDatabase = [
            { t: "الذكاء الاصطناعي وتصميم الحقائب التدريبية", s: "ثورة تكنولوجية في إعادة صياغة المناهج وأهداف الدورات.", body: "تتجه المؤسسات الأكاديمية الحديثة نحو دمج خوارزميات الذكاء الاصطناعي في عمليات تصميم الحقائب التدريبية. هذه التقنيات تساعد المدرب على تحليل مستويات الجمهور المستهدف واقتراح محتوى تفاعلي دقيق ومخصص. إن الاعتماد على الأدوات الذكية يقلل من الوقت المستغرق في إعداد المراجع ويضمن جودة عالية تتوافق مع المعايير العالمية المعاصرة في التعليم المستمر." },
            { t: "قياس عائد الاستثمار ROI في البرامج التدريبية", s: "أدوات مالية وإدارية لتحويل الدورات إلى أرقام ربحية ملموسة.", body: "يعاني العديد من مسؤولي الشركات من صعوبة قياس العائد المالي الحقيقي للبرامج التدريبية المقدمة للموظفين. يتطلب تجاوز هذه المشكلة تطبيق نماذج تقييم كمية ونوعية دقيقة، تربط بشكل مباشر بين تحسن مهارات العاملين بعد الدورة وبين زيادة معدلات الإنتاجية وتقليل التكاليف التشغيلية على المدى الطويل." },
            { t: "استراتيجية التدريب المصغر Microlearning", s: "تقسيم المعرفة الكبيرة إلى جرعات سريعة ومركزة.", body: "مع تزايد مشاغل الحياة اليومية وضيق الوقت لدى المهنيين، برزت تقنية التدريب المصغر كحل فعال ومبتكر. تعتمد هذه الاستراتيجية على طرح مقاطع فيديو قصيرة أو مقالات مركزة لا تتجاوز دقائق معدودة، مما يتيح للمتعلم اكتساب مهارات جديدة بشكل تدريجي ومستمر دون الشعور بالملل أو الإرهاق الذهني." },
            { t: "التقييم الشامل بنظام 360 درجة للقيادات", s: "رؤية متعددة الزوايا لتحسين الأداء الإداري والقيادي.", body: "لا يعتمد تقييم المدير الناجح اليوم على رأي مديره المباشر فقط، بل يمتد ليشمل الزملاء، المرؤوسين، والعملاء أنفسهم. يتيح نظام 360 درجة كشف النقاط العمياء في شخصية القائد الإداري، وتقديم تغذية راجعة موضوعية تساهم بفاعلية في تطوير مهارات الإدارة وصنع القرار الحكيم." },
            { t: "أهمية المهارات الناعمة Soft Skills في سوق العمل", s: "لماذا تتفوق مهارات التواصل على الخبرات التقنية أحياناً.", body: "تشير الدراسات الحديثة إلى أن نسبة كبيرة من فشل الموظف لا تعود لنقص في خبراته التقنية، بل لضعف في مهاراته الناعمة مثل التواصل، حل النزاعات، والعمل الجماعي. المؤسسات اليوم تبحث عن أشخاص يمتلكون الذكاء العاطفي والقدرة على التأثير الإيجابي وبناء شبكة علاقات متينة داخل وخارج بيئة العمل." },
            { t: "التلعيب (Gamification) في تحفيز المتدربين", s: "استخدام آليات الألعاب لرفع حماس ومشاركة الجمهور.", body: "إدخال عناصر المنافسة، النقاط، والمستويات الافتراضية في المنصات التدريبية يغير جذرياً من تجربة المتعلم. التلعيب يكسر حاجز الجمود والملل في القاعات التقليدية، ويدفع المتدرب للمشاركة الفعالة بحماس وشغف، مما يرفع نسبة استيعاب المعلومات وتثبيتها في الذاكرة طويلة المدى." },
            { t: "إدارة المعرفة المؤسسية واستدامة الخبرات", s: "كيف تحافظ الأكاديميات على خبراتها من الضياع عند مغادرة الكوادر.", body: "تفقد بعض المؤسسات جزءاً كبيراً من هويتها وقوتها عند مغادرة الموظفين القدامى بسبب غياب نظام أرشيف ومعرفة قوي. بناء منصة داخلية لتوثيق التجارب، الدروس المستفادة، والخطوات الإدارية يضمن انتقال الخبرة بسلاسة تامة للأجيال الجديدة دون تأثر سير العمل." },
            { t: "مفهوم التدريب المدمج Hybrid Training", s: "الموازنة الذكية بين الحضور الميداني والمنصات الرقمية.", body: "أثبت التدريب المدمج كفاءة عالية في الجمع بين ميزات التفاعل المباش وجهاً لوجه وبين مرونة التعليم عن بعد عبر الإنترنت. يتيح هذا النموذج للمتدربين الاستفادة من النقاشات الحية في القاعات الدراسية مع توفير المحاضرات النظرية والمراجع الرقمية للمراجعة في أي وقت ومن أي مكان." },
            { t: "صناعة القادة عبر برامج التوجيه Mentorship", s: "دور الخبرة الطويلة في تهيئة جيل المستقبل الإداري.", body: "برامج التوجيه والإرشاد المهني تمثل الجسر الحقيقي الذي ينقل خلاصة تجارب المديرين القدامى إلى عقول الشباب الطموح. الجلسات الفردية المنتظمة تساعد الموجه إليه على تجاوز العقبات النفسية والمهنية، وتكسبه رؤية عميقة لكيفية اتخاذ القرارات الاستراتيجية الحاسمة." },
            { t: "التفكير التحليلي وحل المشكلات المعقدة", s: "كيف تتعامل مع التحديات الإدارية المفاجئة باحترافية.", body: "التحديات في بيئة الأعمال لا تنتهي، والناجحون هم من يمتلكون القدرة على تحليل المشكلة من جذورها بدلاً من الاكتفاء بمعالجة الأعراض السطحية. يتطلب التفكير التحليلي جمع البيانات، تفكيك الخيارات المتاحة، وتقييم النتائج المتوقعة لكل قرار قبل اعتماده رسمياً." },
            { t: "أخلاقيات الممارسة المهنية والأكاديمية", s: "المبادئ الحاكمة لضمان مصداقية ونزاهة التدريب.", body: "النزاهة والشفافية هما أساس النجاح المستدام لأي مؤسسة تعليمية أو تدريبية. الالتزام بالأمانة العلمية، احترام خصوصية المتدربين، وتقديم محتوى نزيه وغير مضلل يبني جسوراً من الثقة المتينة والسمعة الطيبة بين الأكاديمية والجمهور المستهدف." },
            { t: "التصميم التعليمي وفق نموذج ADDIE", s: "الخطوات المنهجية الخمس لبناء دورة تدريبية ناجحة.", body: "يُعد نموذج أدي (التحليل، التصميم، التطوير، التنفيذ، والتقييم) الإطار العالمي الأكثر شيوعاً في بناء البرامج التدريبية المعتمدة. سير العمل وفق هذه المراحل المنهجية يضمن بناء مادة علمية متماسكة تغطي كافة احتياجات المتدربين وتحقق الأهداف بدقة متناهية." },
            { t: "ثقافة التعلم المستمر داخل بيئة العمل", s: "تحويل المؤسسة إلى مجتمع معرفي لا يتوقف عن التطور.", body: "الشركات التي تكتفي بما تعلمته في الماضي تصبح معرضة للتراجع والانقراض في سوق متسارع التغيرات. غرس ثقافة التعلم المستمر يشجع الموظفين على قراءة الكتب، حضور ورش العمل، ومواكبة كل جديد في تخصصاتهم، مما يخلق بيئة عمل حيوية ومبتكرة." },
            { t: "مهارات العرض والإلقاء للمدرب الناجح", s: "أسرار شد انتباه الجمهور وإيصال المعلومة بسلاسة.", body: "الوقوف أمام الجمهور يتطلب مهارات خاصة تتجاوز مجرد قراءة الشرائح التقديمية. استخدام نبرات الصوت المناسبة، لغة الجسد الواثقة، وطرح الأسئلة التفاعلية يضمن بقاء المتدربين في حالة تركيز واهتمام طوال فترة المحاضرة التدريبية." },
            { t: "إدارة الأزمات والتغيير المؤسسي بنجاح", s: "كيف تقود فريقك بر الأمان وسط العواصف والمتغيرات المفاجئة.", body: "حين تواجه المؤسسات أزمات اقتصادية أو هيكلية مفاجئة، يظهر المعدن الحقيقي للقيادة. الإدارة الناجحة للتغيير تتطلب تواصلاً شفافاً مع العاملين، ووضع خطط بديلة واضحة، وإشراك الجميع في إيجاد الحلول لتخفيف مقاومة التغيير وضمان استمرارية الإنتاج." },
            { t: "المناهج التدريبية القائمة على الكفايات", s: "التركيز على التطبيق العملي الفعلي بدلاً من الحفظ النظري.", body: "التحول من التعليم التقليدي القائم على الحفظ والتلقين إلى التعليم الموجه للكفايات يمثل نقلة نوعية. المتدرب اليوم يحتاج لمعرفة 'كيف يفعل الشيء' بمهارة وإتقان، وليس فقط لمعرفة 'ما هو الشيء'، مما يرفع من جاهزيته للعمل الميداني فور تخرجه." },
            { t: "تحليل الاحتياجات التدريبية TNA بدقة", s: "البوصلة الصحيحة لتوجيه الميزانيات نحو البرامج المجدية.", body: "إهدار الأموال على دورات عشوائية لا تقدم قيمة حقيقية للموظفين مشكلة شائعة. إجراء تحليل شامل واحترافي للاحتياجات التدريبية يكشف عن الفجوات الحقيقية في الأداء، ويسمح باختيار البرامج التي تستهدف تطوير المهارات المطلوبة فعلاً." },
            { t: "بناء الفرق عالية الأداء في الأكاديميات", s: "كيف توفق بين الشخصيات المختلفة لتحقيق هدف مشترك.", body: "فريق العمل المتجانس ليس وليد الصدفة، بل هو ثمرة اختيار دقيق للمهارات وتوزيع عادل للمهام. تشجيع الحوار المفتوح، وتوضيح الأدوار، والاحتفال بالنجاحات الجماعية يبني لحمة قوية بين أفراد الفريق ويقضي على الخلافات السلبية." },
            { t: "التغذية الراجعة البناءة وأثرها التطويري", s: "الفن الراقي في تقويم أداء المرؤوسين دون تحطيم معنوياتهم.", body: "تقديم الملاحظات للموظفين هو مهارة إدارية دقيقة تتطلب تركيزاً على السلوك المراد تعديله وليس على شخص الإنسان. التغذية الراجعة البناءة تفتح باباً للحوار الإيجابي وتوضح للمتدرب المسار الصحيح للتحسين والتطوير المستمر." },
            { t: "التعليم التفاعلي وحل المشكلات PBL", s: "تمكين العقل البشري عبر خوض سيناريوهات واقعية معقدة.", body: "بدلاً من إلقاء المحاضرات النظرية الطويلة، يعتمد هذا النمط على طرح مشكلة حقيقية مكثفة وطلب من المجموعات تحليلها وإيجاد حلول لها. هذا الأسلوب ينشط التفكير النقدي، ويعلم المتدربين كيفية العمل الجماعي تحت ضغط الواقع." },
            { t: "الابتكار المؤسسي وتطوير الخدمات التعليمية", s: "ابتكار أساليب غير تقليدية لجذب واحتجاز اهتمام الدارسين.", body: "الجمود القاتل هو أكبر تهديد يواجه أي مركز تدريب أو أكاديمية. تشجيع الكوادر على طرح أفكار جريئة ومبتكرة، وتجربة تقنيات جديدة في تقديم المساقات، يحافظ على حيوية المؤسسة ويجعلها دائماً في صدارة المنافسة." },
            { t: "صياغة الأهداف الذكية SMART في التدريب", s: "معايير دقيقة تضمن تحويل الرؤى إلى إنجازات قابلة للقياس.", body: "الهدف الغامض ينتج عنه أداء غامض وعشوائي. الصياغة الصحيحة للأهداف تعني أن يكون الهدف محدداً، قابلاً للقياس، واقعياً، مرتبطاً بالسياق، ومحدد بزمن معين. هذه المنهجية تريح الإدارة وتسهل تقييم نسب النجاح بكل وضوح." },
            { t: "معايير الجودة الشاملة في المراكز الأكاديمية", s: "تطبيق المواصفات العالمية لضمان رضا المستفيدين تماماً.", body: "الحصول على شهادات الجودة ليس مجرد شعار يوضع على الجدران، بل هو نظام عمل يومي يراجع كل صغيرة وكبيرة في الأكاديمية؛ بدءاً من استقبال المتدرب ومروراً بجودة المادة العلمية وحتى تقييم الخدمات المساندة." },
            { t: "مهارات الاستماع النشط للمدرب الفعال", s: "الإنصات بعمق لفهم ما يدور في أذهان المشاركين.", body: "المدرب الناجح يقضي وقتاً في الاستماع لأسئلة وملاحظات المتدربين يفوق ما يقضيه في التكلم. الاستماع النشط لا يقتصر على سماع الكلمات، بل يشمل قراءة لغة الجسد واستشفاف التحديات الخفية للتقديم حلول دقيقة ومخصصة." },
            { t: "إدارة الوقت والإنتاجية الشخصية للمدربين", s: "كيف تنجز مهامك الكثيرة دون الوقوع في فخ الإرهاق.", body: "المهام المتعددة التي تواجه المدرب والأكاديمي يومياً تتطلب نظاماً دقيقاً لترتيب الأولويات. استخدام تقنيات مثل حجز الوقت، جدول أيزنهاور، والتخلص من المشتتات الرقمية يرفع من كفاءة العمل ويمنح الإنسان مساحة للراحة وتجديد النشاط." },
            { t: "الذكاء العاطفي EQ والنجاح المهني المتصاعد", s: "فهم المشاعر الذاتية والآخرين لبيئة عمل هادئة ومنتجة.", body: "السيطرة على الانفعالات، التعاطف مع مشاعر الزملاء، والقدرة على بناء جسور الود هي سمات الأشخاص الذين يتمتعون بذكاء عاطفي عالٍ. في بيئة العمل المشحونة، يمثل هذا الذكاء صمام الأمان لمنع الصراعات وخلق مناخ إيجابي ومحفز للجميع." },
            { t: "التعلم الذاتي والتأملي Reflective Learning", s: "كيف تتعلم من تجاربك وأخطائك اليومية لتصبح أفضل.", body: "التوقف لفترات قصيرة لمراجعة ما تم إنجازه خلال اليوم وتقييم المواقف التي مرت يعزز من سرعة النضج المهني. التعلم التأملي يتيح للإنسان اكتشاف مواطن الخلل بنفسه ووضع خطط تصحيحية فورية تمنع تكرار الأخطاء." },
            { t: "تصميم الاختبارات وأدوات التقييم بموضوعية", s: "بناء أسئلة دقيقة تقيس الفهم العميق لا الحفظ المؤقت.", body: "الاختبارات الضعيفة لا تعطي مؤشراً حقيقياً عن مستوى استيعاب المتدرب. تصميم أدوات تقييم متقدمة تتضمن أسئلة تحليلية وحالات عملية يفرز بدقة مستويات الكفاءة ويضمن أن اجتياز الدورة تم عن استحقاق وجدارة." },
            { t: "فن استخدام القصص Storytelling في الشرح", s: "تحويل المعلومات الجافة إلى تجارب لا تُنسى في ذهن المتدرب.", body: "الدماغ البشري مصمم بطبيعته للتفاعل مع القصص والحكايات أكثر تفاعله مع الجداول والأرقام المجردة. دمج التجارب الواقعية والقصص الهادفة في صلب المادة العلمية يسهل تثبيت المعلومة ويجعل المحاضرة ممتعة وشيقة للغاية." },
            { t: "التسويق الفعّال للبرامج الأكاديمية والتدريبية", s: "استراتيجيات جذب الدارسين وإبراز القيمة الحقيقية للدورات.", body: "حتى لو كانت الدورة التدريبية ممتازة وعالية الجودة، فإنها لن تحقق هدفها إن لم تصل للجمهور المناسب. يتطلب التسويق الأكاديمي الناجح تحديد الفئة المستهدفة بدقة، وإبراز الفوائد المهارية، واستخدام قنوات التواصل الرقمية بذكاء واحترافية." },
            { t: "التغلب على رهبة التحدث أمام الجمهور", s: "استراتيجيات نفسية للسيطرة على الخوف وبث الثقة الذاتية.", body: "الشعور بالقلق قبل صعود المنصة أمر طبيعي حتى لدى الخبراء، لكن تحويل هذه الطاقة العصبية إلى حماس إيجابي هو الفن المطلوب. التدريب المستمر، التنفس العميق، والتحضير الجيد للمقدمة هي المفاتيح الأساسية لكسر حاجز الخوف والظهور بثقة تامة." },
            { t: "تحفيز الكوادر البشرية وزيادة الولاء المؤسسي", s: "بناء بيئة عمل تشعر الموظف بأنه شريك أساسي في النجاح.", body: "التقدير المعنوي والمادي، إتاحة الفرص للتطور، وخلق جو من الأمان الوظيفي هي العوامل التي تبقي الموظفين مرتبطين بمؤسستهم بإخلاص. الولاء المؤسسي لا يُشترى بالأموال، بل يُبنى بالعدالة والشفافية والاحترام المتبادل." },
            { t: "التفكير الإبداعي وتقنيات العصف الذهني المتقدم", s: "كسر الأنماط المعتادة للوصول إلى أفكار غير مسبوقة.", body: "عندما تغلق الأبواب أمام الطرق التقليدية، يأتي دور التفكير الإبداعي. جلسات العصف الذهني الموجهة التي تمنح الحرية الكاملة لطرح الأفكار دون نقد مبكر تفرز عادة حلولاً عبقرية ومبتكرة لكل المشكلات المعقدة." },
            { t: "التدريب الافتراضي وتحديات التفاعل عن بعد", s: "كيف تحافظ على انتباه المشاركين عبر شاشات الإنترنت.", body: "التدريب أونلاين يواجه تحدي المشتتات المنزلية وضعف التركيز لدى الحاضرين. التغلب على ذلك يتطلب استخدام أدوات تفاعلية حية، طرح أسئلة مفاجئة، وتقسيم المحاضرة إلى فقرات قصيرة ومكثفة لضمان تفاعل دائم." },
            { t: "إدارة القاعات التدريبية بمرونة وحكمة", s: "التعامل السليم مع أنماط الشخصيات المختلفة للمتدربين.", body: "كل قاعة تدريبية تضم تشكيلة واسعة من الشخصيات؛ منهم المتفاعل، الصامت، أو المعترض دائماً. المدرب المحترف هو من يمتلك الذكاء الاجتماعي لامتصاص المواقف الصعبة، وتوجيه طاقات الجميع بما يخدم مصلحة البرنامج التدريبي العام." },
            { t: "تمكين القيادات النسائية في المؤسسات التعليمية", s: "دعم الطاقات النسائية وإبراز دورهن الفعال في صناعة القرار.", body: "الاستثمار في قيادات المستقبل يقتضي إتاحة فرص متكافئة لتمكين المرأة وتزويدها بالمهارات الإدارية والتنفيذية المتقدمة. تجارب العديد من المؤسسات أثبتت أن القيادات النسائية يمتلكن قدرات فريدة في التعاطف الإداري وإدارة الأزمات بكفاءة عالية." },
            { t: "الشراكات الاستراتيجية بين الأكاديميات وسوق العمل", s: "تجسير الفجوة بين المخرجات الأكاديمية والاحتياجات الفعلية.", body: "لا يمكن لأي أكاديمية أن تعزل نفسها عن التطورات الميدانية لقطاع الأعمال. بناء شراكات وثيقة مع الشركات والجهات المهنية يضمن تحديث المناهج بصفة مستمرة، ويخلق فرص توظيف حقيقية ومباشرة للخريجين." },
            { t: "التعلم القائم على المشروعات الميدانية", s: "ترسيخ المعرفة عبر إنتاج حلول حقيقية وقابلة للتنفيذ.", body: "التطبيق العملي الفوري هو أقصر طريق لترسيخ المعلومات المعقدة في عقل المتدرب. تكليف الدارسين بمشروع ميداني يحل مشكلة حقيقية يمنحهم ثقة عالية وخبرة عملية تضاهي سنوات من الدراسة النظرية البحتة." },
            { t: "إدارة التنوع الثقافي والفكري في بيئة التدريب", s: "احترام الفروق الفردية وتحويلها إلى نقطة قوة للمجموعة.", body: "القاعات التدريبية الحديثة تضم أفراداً من خلفيات وثقافات متنوعة. استثمار هذا التنوع بشكل إيجابي يثري النقاشات ويوسع مدارك المشاركين، ويعلم الجميع فن قبول الرأي الآخر والتعاون بروح الفريق الواحد." },
            { t: "الحوكمة والشفافية في الإدارة الأكاديمية", s: "ترسيخ معايير النزاهة والوضوح في كافة العمليات واللوائح.", body: "وجود أنظمة واضحة وشفافة تحكم العلاقة بين الإدارة، المدربين، والمتدربين يحمي المؤسسة من التخبط ويضمن سير العمل بسلاسة تامة. الحوكمة الرشيدة هي الضمان الأساسي للنمو المتوازن والمستدام." },
            { t: "إعادة التأهيل المهني Reskilling لمواجهة المستقبل", s: "اكتساب مهارات جديدة للتعامل مع متطلبات الوظائف الحديثة.", body: "مع التطور التكنولوجي المتسارع، اندثرت وظائف وظهرت أخرى جديدة تماماً. برامج إعادة التأهيل المهني تمنح الموظفين القدامى فرصة حقيقية لتجديد قدراتهم وملاءمة مهاراتهم للوقوف بقوة في سوق العمل المتغير." },
            { t: "تخطيط المسارات الوظيفية للكوادر الأكاديمية", s: "رؤية مستقبلية واضحة تضمن تدرج الموظف ونموه بنجاح.", body: "غياب الوضوح حول مستقبل التطور الوظيفي يدفع الكفاءات للبحث عن بيئات عمل أخرى. وضع خطط مسار وظيفي شفافة ومحفزة يشعر العاملين بالأمان والاستقرار، ويدفعهم لبذل أقصى طاقاتهم لخدمة المؤسسة." },
            { t: "التحول الرقمي وأتمتة العمليات التعليمية", s: "التخلي عن الأوراق واستخدام الأنظمة الذكية لإدارة الأكاديمية.", body: "أتمتة عمليات التسجيل، الحضور، إصدار الشهادات، ومتابعة التقارير تفرغ الطاقات الإدارية للتركيز على الجانب الابداعي والتطويري. التحول الرقمي لم يعد خياراً ترفيهياً، بل أصبح ضرورة تشغيلية ملحة." },
            { t: "مهارات التفاوض وحل النزاعات باحترافية", s: "الوصول إلى حلول وسط ترضي جميع الأطراف دون خسائر.", body: "الخلافات في وجهات النظر أمر طبيعي داخل بيئة العمل الكبيرة. امتلاك مهارات التفاوض الإيجابي يمكن القادة من تحويل الصراعات إلى فرصة للتفاهم والتعاون، والوصول إلى تسضيغ تضمن حقوق الجميع وتدعم استقرار المؤسسة." },
            { t: "بناء الهوية المهنية Portfolio للمدرب الناجح", s: "كيف توثق إنجازاتك وتبرز خبراتك بصورة احترافية وجذابة.", body: "الملف المهني الموثق بالأدلة، شهادات الشكر، ونماذج الدورات السابقة هو البطاقة التعريفية الأقوى للمدرب في السوق. تنظيم وتحديث هذا الملف باستمرار يفتح أبواب التعاون مع كبرى الأكاديميات والمؤسسات." },
            { t: "استراتيجيات التعلم السريع والمسرع", s: "تقنيات علمية لزيادة سرعة استيعاب وتذكر المعلومات الكثيرة.", body: "علوم الدماغ الحديثة قدمت تقنيات مذهلة تتيح للإنسان مضاعفة قدرته على القراءة والاستيعاب والتذكر. تطبيق هذه الاستراتيجيات في الدورات التدريبية يختصر أوقات التعلم الطويلة ويقدم فائدة قصوى بجهد أقل." },
            { t: "إدارة ضغوط العمل والوقاية من الاحتراق الوظيفي", s: "حماية الصحة النفسية والطاقة الذهنية وسط زحام المهام.", body: "العمل المتواصل دون فترات راحة كافية يقود حتماً إلى مرحلة الاحتراق الوظيفي وفقدان الشغف. تعلم فن وضع الحدود، أخذ استراحات حقيقية، والاهتمام بالرعاية الذاتية يضمن استمرار الإنتاجية بحيوية وسعادة." },
            { t: "توثيق سياسات التدريب وبناء الأدلة الإجرائية", s: "مرجعية رسمية تضمن توحيد معايير الأداء والعمل داخل الأكاديمية.", body: "وجود أدلة تنظيمية مكتوبة وواضحة لكل إجراءات العمل يمنع الاجتهادات الفردية الخاطئة، ويسهل عملية تدريب الموظفين الجدد، ويضمن تقديم خدمة متسقة وعالية الجودة في كل الأوقات." },
            { t: "استشراف المستقبل وقراءة الاتجاهات التدريبية القادمة", s: "الاستعداد المبكر للمهارات والتقنيات التي ستحكم عالم الغد.", body: "المؤسسات الرائدة لا تنتظر المستقبل حتى يداهمها، بل تقرأ المؤشرات العالمية وتستعد لها مسبقاً. دراسة التغيرات المستقبلية في قطاع التعليم والتدريب تمنح الأكاديمية أسبقية تنافسية هائلة وتجعلها في قمة الريادة." },
            { t: "الرؤية الشاملة للتميز الأكاديمي بقلم رضا الحجي", s: "خلاصة التجارب والمفاهيم للوصول بالعمل التدريبي للقمة المطلقة.", body: "إن الرحلة المستمرة نحو التميز الأكاديمي تتطلب إيماناً عميقاً برسالة المعرفة، والتزاماً صارماً بأعلى معايير الجودة والمهنية. من خلال دمج الأصالة بالتحديث المستمر، نستطيع بناء أجيال قيادية قادرة على قيادة المستقبل بثقة واقتدار، واضعين نصب أعيننا رفعة الأمة وتطور مجتمعاتنا نحو آفاق أوسع." }
        ];

        const totalArticles = 50;
        const articlesContainer = document.getElementById('articlesContainer');

        for (let i = 1; i <= totalArticles; i++) {
            const articleHTML = `
                <div class="article-card">
                    <span class="month-badge">📅 شهر 09 - مقال (${i})</span>
                    
                    <div class="upload-section">
                        <label for="upload-${i}" class="upload-btn">اختر صورة المقال 📷</label>
                        <input type="file" id="upload-${i}" accept="image/*" style="display: none;" onchange="previewImage(this, 'preview-${i}')">
                        <img id="preview-${i}" class="image-preview" alt="معاينة صورة المقال">
                    </div>

                    <div id="text-${i}" class="article-content">
                        <h2 id="title-${i}" class="article-title">مقال شهر 9 - رقم (${i})</h2>
                        <h3 id="subtitle-${i}" class="article-subtitle">العنوان الفرعي سيظهر هنا...</h3>
                        <span class="article-author">بقلم: رضا الحجي</span>
                        <p id="content-${i}" class="article-body">اضغط على زر "توليد مقال أكاديمي" أدناه لإنشاء المحتوى الفريد الخاص بهذا المقال (300 كلمة)...</p>
                    </div>

                    <div class="actions-group">
                        <button class="action-btn generate-btn" onclick="generateUniqueArticle(${i})">توليد مقال أكاديمي 🪄</button>
                        <button class="action-btn copy-btn" onclick="copyArticle('text-${i}')">نسخ المقال 📋</button>
                    </div>
                    
                </div>
            `;
            
            articlesContainer.insertAdjacentHTML('beforeend', articleHTML);
        }

        function previewImage(inputElement, previewId) {
            const file = inputElement.files[0];
            const previewImage = document.getElementById(previewId);
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // دالة عرض المقال الحصري الخاص بكل بطاقة بدقة بدون أي تكرار
        function generateUniqueArticle(index) {
            const articleObj = articlesDatabase[index - 1]; // جلب المقال المخصص حصرياً لهذا الرقم

            const titleText = articleObj.t;
            const subtitleText = articleObj.s;
            const bodyText = articleObj.body;

            // بناء المقال بالكامل مع اسم الكاتب
            const fullContentHTML = `<strong>${titleText}</strong><br><br><em>${subtitleText}</em><br><br>بقلم: رضا الحجي<br><br>${bodyText}`;

            document.getElementById(`title-${index}`).innerText = titleText;
            document.getElementById(`subtitle-${index}`).innerText = subtitleText;
            
            const contentElement = document.getElementById(`content-${index}`);
            contentElement.innerHTML = bodyText;
            contentElement.style.color = "#475569";
            contentElement.style.fontStyle = "normal";
        }

        function copyArticle(textId) {
            const articleContainer = document.getElementById(textId);
            const textToCopy = articleContainer.innerText;
            
            if (textToCopy.includes("اضغط على زر")) {
                alert('⚠️ يرجى توليد المقال الأكاديمي أولاً قبل النسخ!');
                return;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('✅ تم نسخ المقال (بالعنوان والترويسة) بنجاح!');
            }).catch(err => {
                alert('❌ حدث خطأ أثناء النسخ.');
                console.error(err);
            });
        }
    </script>
</body>
